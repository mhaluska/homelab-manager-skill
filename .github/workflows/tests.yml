name: Tests

# Unit tests (they target macOS, like the plugin) and the scaffolded repo template.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0          # template-history.json is checked against the release tags
          fetch-tags: true

      - name: Tools
        run: |                    # nmap is optional: the tests that need it skip without it
          brew install yq
          pipx install ansible-core   # ansible-inventory: drift, overview, ssh_probe and routeros tests read the inventory

      - name: Unit tests
        run: python3 -m unittest discover -s tests

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Tools
        run: |
          set -eu
          # the snap yq is confined and can't read the temp files the scripts hand it
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo snap install --classic opentofu
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer
          pipx install --include-deps ansible
          ansible-galaxy collection install -r skills/homelab-manager/assets/repo-template/ansible/requirements.yml

      - name: Validate the scaffolded template
        run: .github/validate_template.sh
