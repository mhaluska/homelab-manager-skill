name: Language check

# This repository is English-only: code, comments, docs, commit messages and pull requests.
# Checks the lines a pull request adds, its commit messages, title and description
# (.github/check_english.py). Make it a required status check in the branch protection of main.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0

      - name: Title and description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$TITLE" "$BODY" | python3 .github/check_english.py text

      - name: Added lines and commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/check_english.py diff "$BASE" "$HEAD"
