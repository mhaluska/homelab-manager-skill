# Patch ONE Proxmox VE node and keep its guests available.
#
#   python3 $HM/scripts/proxmox_inventory.py --details && python3 $HM/scripts/pve_node_plan.py <node>
#   ansible-playbook playbooks/patch-proxmox-node.yml -e proxmox_patch_node=<inventory host> [-e reboot=if_required]
# A node of another site (inventory group site_<name>): --site <name> on both scripts. A standalone node (no
# cluster) has nowhere to move guests: every running one is shut down for the reboot.
#
# Executes the node's plan in discovery/pve-patch.json (pve_node_plan.py; under its site, then node; show it to
# the user first) after checking it
# against the live cluster. reboot: never (default) only upgrades packages (guests keep running) and reports
# whether a reboot is pending (the plan as planned_*; nothing is moved) and which services still run replaced
# libraries (restart_pending). if_required (old name: allow_reboot=true) reboots when a newer kernel is installed or
# /var/run/reboot-required exists; always reboots anyway, e.g. when only services wait for a restart (GitHub
# issue #163). A reboot run, with the same checks either way:
#   migrate  → live (VM) / restart (LXC) migration to the planned node, back after the reboot
#   ha       → HA node maintenance mode moves them off and back
#   stop     → clean shutdown in reverse startup order (never forced; if one fails, the stopped ones are
#              started again and nothing reboots), started again after the reboot
# Before anything stops: every LVM-thin pool on the node must be healthy with metadata room; -e thin_check=true
# also runs thin_check on a metadata snapshot of each (GitHub issue #91, references/patching.md "LVM-thin pools").
# Finally every guest that ran before must run again (on this node, unless -e migrate_back=false).
# Failed systemd units (GitHub issue #162, tasks/failed-units.yml): a unit that fails only after the upgrade is
# reported (new_failed_units); a reboot run stops on it before anything moves or stops, unless the user accepts it
# (-e failed_units_accept=a.service,b.service). A new failed unit that is disabled (the upgrade started it) is
# only reported: it stays down after the reboot. After the reboot the check runs again; a unit that fails then
# fails the run only at the end, after the guests are back.
# After the reboot it waits for Proxmox's own onboot start (pve-guests) to finish, up to pve_guests_timeout
# seconds (default 1800), before it starts the stopped guests that did not come up by themselves.
# The Proxmox node name defaults to the inventory short name; set proxmox_node_name if it differs.
# -e zabbix=true -e hm_scripts=$HM/scripts (under `with_secrets.py zabbix-rw -- …`, tasks/zabbix.yml, GitHub issue
# #169): no open Zabbix problem at zabbix.patch_gate_severity on the node before the upgrade; a reboot run puts the
# node and the guests it moves or stops in one maintenance window, and the run ends with their agents answering
# again and no new problem.
- name: Patch one Proxmox VE node
  hosts: "{{ proxmox_patch_node | default('__no_node__') }}"
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    allow_reboot: false
    reboot: "{{ 'if_required' if allow_reboot | bool else 'never' }}"
    migrate_back: true
    pve_node: "{{ proxmox_node_name | default(inventory_hostname_short) }}"
    hm_site: "{{ group_names | select('match', '^site_') | map('regex_replace', '^site_', '') | first | default('') }}"
    plan_file: "{{ playbook_dir }}/../../discovery/pve-patch.json"
    # the site whose plan applies: this node's site_<name> group, or the default site for a node in none
    plan_site: >-
      {%- set ns = namespace(key='') -%}
      {%- for key, nodes in ((lookup('ansible.builtin.file', plan_file, errors='ignore') or '{}') | from_json).sites | default({}) | dictsort
            if nodes[pve_node] is defined
            and ((hm_site and nodes[pve_node].site | default('') == hm_site)
                 or (not hm_site and nodes[pve_node].default_site | default(false))) -%}
        {%- set ns.key = key -%}
      {%- endfor -%}
      {{ ns.key }}
    plan_ids: "{{ plan.guests | map(attribute='vmid') | list }}"
    plan_running: "{{ plan.guests | selectattr('status', 'equalto', 'running') | map(attribute='vmid') | list }}"
    by_action: "{{ plan.guests | groupby('action') | items2dict(key_name=0, value_name=1) }}"
    # start one guest unless it runs; a guest that another start (onboot, HA) brought up meanwhile makes
    # `start` fail with "already running": a guest that runs within 30 s counts as started (GitHub issue #141)
    hm_start_guest: |
      {{ hm_guest_cmd }} status {{ hm_guest_id }} | grep -q running && exit 0
      {{ hm_guest_cmd }} start {{ hm_guest_id }} && exit 0
      for i in 1 2 3 4 5 6; do
        sleep 5
        {{ hm_guest_cmd }} status {{ hm_guest_id }} | grep -q running && exit 0
      done
      exit 1

  pre_tasks:
    - name: Exactly one approved hypervisor
      ansible.builtin.assert:
        that:
          - proxmox_patch_node is defined
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in groups['proxmox_nodes'] | default([])
        fail_msg: "Pass -e proxmox_patch_node=<one host of the proxmox_nodes group>."

    - name: Reboot policy
      ansible.builtin.assert:
        that: reboot in ['never', 'if_required', 'always']
        fail_msg: "reboot must be never, if_required or always (got {{ reboot }})."

    - name: A plan exists for this node
      ansible.builtin.assert:
        that: plan_site | length > 0
        fail_msg: >-
          discovery/pve-patch.json has no plan for {{ pve_node }}{{ (' at site ' ~ hm_site) if hm_site else '' }}:
          run pve_node_plan.py {{ pve_node }}{{ (' --site ' ~ hm_site) if hm_site else '' }} (set proxmox_node_name?)

    - name: Load the plan (pve_node_plan.py)
      ansible.builtin.set_fact:
        plan: "{{ (lookup('ansible.builtin.file', plan_file) | from_json).sites[plan_site][pve_node] }}"

    - name: Plan is for this node
      ansible.builtin.assert:
        that: plan.node == pve_node and (not hm_site or plan.site | default('') == hm_site)
        fail_msg: >-
          The plan is for {{ plan.node }}{{ (' at site ' ~ plan.site) if plan.site | default('') else '' }},
          not {{ pve_node }}{{ (' at site ' ~ hm_site) if hm_site else '' }} (set proxmox_node_name?)

    - name: Part of a cluster?
      ansible.builtin.stat:
        path: /etc/pve/corosync.conf
      register: pve_corosync

    - name: Cluster quorum
      ansible.builtin.command: pvecm status
      register: pve_quorum
      changed_when: false
      check_mode: false
      failed_when: pve_quorum.stdout is not search('Quorate:\s+Yes')
      when: pve_corosync.stat.exists

    - name: Cluster resources now
      ansible.builtin.command: pvesh get /cluster/resources --output-format json
      register: pve_res
      changed_when: false
      check_mode: false

    - name: Live state of this node
      ansible.builtin.set_fact:
        pve_offline: "{{ pve_res.stdout | from_json | selectattr('type', 'equalto', 'node') | rejectattr('status', 'equalto', 'online') | map(attribute='node') | list }}"
        live_guests: "{{ pve_res.stdout | from_json | selectattr('type', 'in', ['qemu', 'lxc']) | selectattr('node', 'equalto', pve_node) | rejectattr('template', 'truthy') | list }}"

    - name: All nodes online and the plan still matches
      ansible.builtin.assert:
        that:
          - pve_offline | length == 0
          - live_guests | map(attribute='vmid') | sort == plan_ids | sort
          - live_guests | selectattr('status', 'equalto', 'running') | map(attribute='vmid') | sort == plan_running | sort
        fail_msg: >-
          Offline nodes: {{ pve_offline }}. Guests now {{ live_guests | map(attribute='vmid') | sort }}
          (running {{ live_guests | selectattr('status', 'equalto', 'running') | map(attribute='vmid') | sort }}),
          plan {{ plan_ids | sort }} (running {{ plan_running | sort }}). Refresh proxmox_inventory.py --details
          and pve_node_plan.py, show the new plan.

    - name: Record the state before patching (state_before in the node's plan)
      ansible.builtin.copy:
        dest: "{{ plan_file }}"
        content: >-
          {{ (lookup('ansible.builtin.file', plan_file) | from_json)
             | combine({'sites': {plan_site: {pve_node: {'state_before': {'recorded_at': now(utc=true).isoformat(),
                                                                          'guests': live_guests}}}}}, recursive=true)
             | to_nice_json }}
        mode: "0644"
      delegate_to: localhost
      become: false

  tasks:
    - name: Zabbix gate before the upgrade (zabbix=true)
      ansible.builtin.include_tasks: tasks/zabbix.yml
      vars:
        zabbix_phase: check
      when: zabbix | default(false) | bool

    - name: Failed systemd units before the upgrade
      ansible.builtin.include_tasks: tasks/failed-units.yml
      vars:
        failed_units_phase: before

    - name: Upgrade packages (guests keep running)
      ansible.builtin.apt:
        upgrade: full
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: pve_upgrade

    - name: Newest installed kernel
      ansible.builtin.shell: ls -1 /boot/vmlinuz-* | sed 's#^/boot/vmlinuz-##' | sort -V | tail -n 1
      register: pve_kernel
      changed_when: false
      check_mode: false

    - ansible.builtin.stat:
        path: /var/run/reboot-required
      register: pve_reboot_flag

    - name: Services still running replaced code (restart_pending)
      ansible.builtin.include_tasks: tasks/restart-check.yml

    # after restart-check.yml, which sets its own needs_reboot: this node's kernel and flag check decides
    - name: Reboot needed, and will this run reboot?
      ansible.builtin.set_fact:
        needs_reboot: "{{ pve_reboot_flag.stat.exists or (pve_kernel.stdout | trim) != ansible_facts.kernel }}"
        hm_do_reboot: >-
          {{ reboot == 'always' or (reboot == 'if_required'
             and (pve_reboot_flag.stat.exists or (pve_kernel.stdout | trim) != ansible_facts.kernel)) }}

    - name: Failed systemd units after the upgrade
      ansible.builtin.include_tasks: tasks/failed-units.yml
      vars:
        failed_units_phase: after
        failed_units_mode: report
        failed_units_split_disabled: true

    - name: Remember the units the upgrade left failed
      ansible.builtin.set_fact:
        hm_upgrade_new_failed: "{{ hm_new_failed }}"
        hm_upgrade_new_failed_disabled: "{{ hm_new_failed_disabled }}"
        hm_upgrade_failed_msg: "{{ hm_failed_units_msg }}"

    # While every guest still runs: a service the upgrade broke on the hypervisor is looked at first
    - name: No new failed units before the reboot
      ansible.builtin.assert:
        that: hm_upgrade_new_failed | length == 0
        fail_msg: >-
          {{ hm_upgrade_failed_msg }}. Nothing was moved, stopped or rebooted: the guests keep running. Check
          `journalctl -u <unit>` on {{ pve_node }}; once it is fixed, or the user accepts it, run again with
          -e failed_units_accept={{ hm_upgrade_new_failed | join(',') }}.
      when: hm_do_reboot | bool

    # LVM-thin pools (GitHub issue #91): a pool is thin_check'ed only when it is activated, so stopping all its
    # guests or the reboot is its first check since boot; on PVE 9 a pool that failed it (status:64) left every
    # guest on it unable to start. Check before anything stops, while the guests still run.
    - name: LVM-thin pools before the reboot
      when: hm_do_reboot | bool
      block:
        - name: LVM-thin pools on the node
          ansible.builtin.command: >-
            lvs --reportformat json -o vg_name,lv_name,lv_attr,data_percent,metadata_percent -S segtype=thin-pool
          register: pve_thin
          changed_when: false
          check_mode: false

        - name: Pools are healthy and have metadata room
          ansible.builtin.assert:
            that:
              - item.lv_attr[8] | default('-') == '-'
              - (item.metadata_percent | default(0, true) | float) < 90
            fail_msg: >-
              LVM-thin pool {{ item.vg_name }}/{{ item.lv_name }}: attr {{ item.lv_attr }} (9th character: F failed,
              M metadata read-only, D out of data), metadata {{ item.metadata_percent }}% used. Don't stop its guests
              or reboot: back them up first. See references/patching.md "LVM-thin pools".
            quiet: true
          loop: "{{ (pve_thin.stdout | from_json).report[0].lv | default([]) }}"
          loop_control:
            label: "{{ item.vg_name }}/{{ item.lv_name }}"

        # -e thin_check=true: thin_check on a metadata snapshot of each active pool (reserved and released through
        # dm messages; the guests keep running). A failure stops the run before any guest is touched.
        - name: thin_check on a metadata snapshot
          ansible.builtin.shell: |
            set -u
            DM={{ (item.vg_name | replace('-', '--')) ~ '-' ~ (item.lv_name | replace('-', '--')) }}
            T=/dev/mapper/$DM-tpool; [ -e "$T" ] || T=/dev/mapper/$DM
            dmsetup message "$T" 0 reserve_metadata_snap || exit 3
            rc=0; thin_check -m "/dev/mapper/${DM}_tmeta" || rc=$?
            dmsetup message "$T" 0 release_metadata_snap
            exit $rc
          register: pve_thin_check
          changed_when: false
          failed_when: false
          loop: "{{ (pve_thin.stdout | from_json).report[0].lv | default([]) | selectattr('lv_attr', 'match', '^....a') | list }}"
          loop_control:
            label: "{{ item.vg_name }}/{{ item.lv_name }}"
          when: thin_check | default(false) | bool and not ansible_check_mode

        - name: thin_check passed
          ansible.builtin.fail:
            msg: >-
              {{ 'Could not reserve a metadata snapshot of' if item.rc == 3 else 'thin_check failed (rc ' ~ item.rc ~ ') on' }}
              LVM-thin pool {{ item.item.vg_name }}/{{ item.item.lv_name }}{{ (': ' ~ detail) if detail else '' }}.
              Nothing was stopped. Don't stop its guests or reboot: back them up or move them first.
              See references/patching.md "LVM-thin pools".
          vars:
            detail: "{{ (item.stderr | default('') or item.stdout | default('')) | trim | truncate(300) }}"
          loop: "{{ pve_thin_check.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list }}"
          loop_control:
            label: "{{ item.item.vg_name }}/{{ item.item.lv_name }}"

    - name: Zabbix maintenance window for the node and the guests it moves or stops (zabbix=true)
      ansible.builtin.include_tasks: tasks/zabbix.yml
      vars:
        zabbix_phase: window
        zabbix_hosts: "{{ [inventory_hostname] + hm_zbx_guests }}"
        hm_zbx_guests: >-
          {{ plan.guests | selectattr('status', 'equalto', 'running') | selectattr('action', 'in', ['stop', 'migrate', 'ha'])
             | map(attribute='name') | select | list }}
      when: zabbix | default(false) | bool and hm_do_reboot | bool

    - name: Move guests off, reboot, bring them back
      when: hm_do_reboot | bool and not ansible_check_mode
      block:
        - name: HA node maintenance on (HA moves its guests away)
          ansible.builtin.command: ha-manager crm-command node-maintenance enable {{ pve_node }}
          when: by_action.ha | default([]) | length > 0

        - name: Wait for HA guests to leave
          ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
          register: pve_ha_res
          changed_when: false
          until: >-
            pve_ha_res.stdout | from_json | selectattr('node', 'equalto', pve_node)
            | selectattr('vmid', 'in', by_action.ha | map(attribute='vmid') | list) | list | length == 0
          retries: 90
          delay: 10
          when: by_action.ha | default([]) | length > 0

        - name: Migrate guests on shared storage
          ansible.builtin.include_tasks: tasks/pve-migrate.yml
          loop: "{{ by_action.migrate | default([]) | sort(attribute='mem_gib', reverse=true) }}"
          loop_control:
            loop_var: guest
            label: "{{ guest.vmid }} → {{ guest.target }}"
          vars:
            src: "{{ pve_node }}"
            dst: "{{ guest.target }}"

        # Shutdown and the emptiness check share one rescue: whatever fails before the reboot, the stopped guests
        # are started again and HA maintenance is turned off, so a failed run never leaves the node's guests down
        # (GitHub issue #90).
        - name: Shut down pinned guests and confirm the node is empty
          block:
            - name: Shutdown (reverse startup order, never forced)
              ansible.builtin.command: >-
                {{ 'qm' if (plan.guests | selectattr('vmid', 'equalto', item) | first).type == 'vm' else 'pct' }}
                shutdown {{ item }} --timeout {{ pve_shutdown_timeout | default(180) }}
              loop: "{{ plan.stop_order }}"

            # /cluster/resources comes from pvestatd and lags ~10 s behind a shutdown or migration: poll it
            - name: Nothing runs on the node any more
              ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
              register: pve_empty
              changed_when: false
              until: >-
                pve_empty.stdout | from_json | selectattr('node', 'equalto', pve_node)
                | selectattr('status', 'equalto', 'running') | list | length == 0
              retries: 12
              delay: 10
          rescue:
            - name: Start again what was stopped (startup order)
              ansible.builtin.shell: "{{ hm_start_guest }}"
              loop: "{{ plan.stop_order | reverse | list }}"
              vars:
                hm_guest_cmd: "{{ 'qm' if (plan.guests | selectattr('vmid', 'equalto', item) | first).type == 'vm' else 'pct' }}"
                hm_guest_id: "{{ item }}"
            - name: HA node maintenance off (HA brings its guests back)
              ansible.builtin.command: ha-manager crm-command node-maintenance disable {{ pve_node }}
              when: by_action.ha | default([]) | length > 0
            - ansible.builtin.fail:
                msg: >-
                  {{ ansible_failed_task.name }} failed, so the node was not rebooted: started the stopped guests
                  again{{ ' and turned HA maintenance off' if by_action.ha | default([]) | length > 0 else '' }}.
                  Migrated guests stay on their target node. Still running on {{ pve_node }}:
                  {{ (pve_empty.stdout | default('[]') | from_json | selectattr('node', 'equalto', pve_node)
                     | selectattr('status', 'equalto', 'running') | map(attribute='vmid') | list)
                     if pve_empty is defined and pve_empty.stdout is defined else 'unknown' }}. Investigate first.

        - name: Reboot
          ansible.builtin.reboot:
            reboot_timeout: 1800
            msg: "Reboot by homelab-manager patching"

        - name: Wait for quorum
          ansible.builtin.command: pvecm status
          register: pve_quorum_after
          changed_when: false
          until: pve_quorum_after.stdout is search('Quorate:\s+Yes')
          retries: 60
          delay: 10
          when: pve_corosync.stat.exists

        # One line per unit: `systemctl is-active a b` exits 0 when ANY of them is active, so each line is
        # checked (GitHub issue #141). pve-guests (oneshot) stays `activating` until startall has started every
        # onboot guest with its startup delays; `failed` ends the wait too, the next task starts what is down.
        - name: Wait for Proxmox services and onboot guests (pve-guests)
          ansible.builtin.command: systemctl is-active pve-cluster pvedaemon pveproxy pvestatd pve-guests
          register: pve_services
          changed_when: false
          failed_when: false
          until: >-
            pve_services.stdout_lines | length == 5
            and pve_services.stdout_lines[:4] | reject('equalto', 'active') | list | length == 0
            and pve_services.stdout_lines[4] in ['active', 'failed']
          retries: "{{ ((pve_guests_timeout | default(1800) | int) / 10) | round(0, 'ceil') | int }}"
          delay: 10

        # Reported now and judged at the end: whatever this check finds, the guests come back first
        - name: Failed systemd units after the reboot
          block:
            - name: Compare with before the upgrade
              ansible.builtin.include_tasks: tasks/failed-units.yml
              vars:
                failed_units_phase: after
                failed_units_mode: report
                failed_units_split_disabled: true

            - name: Remember the units failed after the reboot
              ansible.builtin.set_fact:
                hm_reboot_new_failed: "{{ hm_new_failed }}"
                hm_reboot_failed_msg: "{{ hm_failed_units_msg }}"
          rescue:
            - name: The check could not run (the guests come back anyway)
              ansible.builtin.set_fact:
                hm_reboot_new_failed: []
                hm_reboot_failed_msg: ''
                hm_reboot_failed_check: "{{ ansible_failed_result.msg | default('failed') | truncate(200) }}"

        - name: Start pinned guests that did not start by themselves (startup order)
          ansible.builtin.shell: "{{ hm_start_guest }}"
          loop: "{{ by_action.stop | default([]) | sort(attribute='startup_order') }}"
          loop_control:
            label: "{{ item.vmid }}"
          vars:
            hm_guest_cmd: "{{ 'qm' if item.type == 'vm' else 'pct' }}"
            hm_guest_id: "{{ item.vmid }}"

        - name: HA node maintenance off (HA brings its guests back)
          ansible.builtin.command: ha-manager crm-command node-maintenance disable {{ pve_node }}
          when: by_action.ha | default([]) | length > 0

        - name: Migrate guests back
          ansible.builtin.include_tasks: tasks/pve-migrate.yml
          loop: "{{ by_action.migrate | default([]) if migrate_back | bool else [] }}"
          loop_control:
            loop_var: guest
            label: "{{ guest.vmid }} ← {{ guest.target }}"
          vars:
            src: "{{ guest.target }}"
            dst: "{{ pve_node }}"

  post_tasks:
    - name: Guests after patching
      ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
      register: pve_after
      changed_when: false
      check_mode: false
      vars:
        home: "{{ plan_running if migrate_back | bool else (plan_running | difference(by_action.migrate | default([]) | map(attribute='vmid'))) }}"
        now_list: "{{ pve_after.stdout | default('[]') | from_json }}"
      until: >-
        now_list | selectattr('vmid', 'in', plan_running) | selectattr('status', 'equalto', 'running') | list | length == plan_running | length
        and now_list | selectattr('vmid', 'in', home) | selectattr('node', 'equalto', pve_node) | list | length == home | length
      retries: 30
      delay: 10
      when: hm_do_reboot | bool and not ansible_check_mode

    - name: Zabbix gate after patching and close the window (zabbix=true)
      ansible.builtin.include_tasks: tasks/zabbix.yml
      vars:
        zabbix_phase: done
        zabbix_hosts: "{{ [inventory_hostname] + (hm_zbx_guests if hm_do_reboot | bool else []) }}"
        hm_zbx_guests: >-
          {{ plan.guests | selectattr('status', 'equalto', 'running') | selectattr('action', 'in', ['stop', 'migrate', 'ha'])
             | map(attribute='name') | select | list }}
      when: zabbix | default(false) | bool

    # what was done only when the reboot block ran; otherwise the plan as planned_* (GitHub issue #86)
    - name: Result
      ansible.builtin.debug:
        msg: >-
          {{ pve_node }}: updated={{ pve_upgrade.changed }}, reboot_needed={{ needs_reboot }},
          rebooted={{ did_reboot }},
          migrated={{ planned_migrate if did_reboot | bool else [] }},
          ha={{ planned_ha if did_reboot | bool else [] }},
          stopped_and_restored={{ plan.stop_order if did_reboot | bool else [] }}
          {%- if not did_reboot | bool %}, planned_migrate={{ planned_migrate }}, planned_ha={{ planned_ha }},
          planned_stop={{ plan.stop_order }}{% endif %},
          restart_pending={{ restart_pending | default([]) }},
          new_failed_units={{ hm_upgrade_new_failed | default([]) }}
          {%- if hm_upgrade_new_failed_disabled | default([]) %}, new_failed_disabled={{ hm_upgrade_new_failed_disabled
          }} (disabled: the upgrade started them, they stay down after a reboot){% endif %}
          {%- if did_reboot | bool %}, failed_after_reboot={{ hm_reboot_new_failed | default([]) }}{% endif %}
          {%- if hm_reboot_failed_check is defined %}, the failed-unit check after the reboot did not run
          ({{ hm_reboot_failed_check }}){% endif %}
          {%- if hm_upgrade_new_failed | default([]) and not did_reboot | bool %}. {{ hm_upgrade_failed_msg }}{% endif %}
          {%- if restart_pending | default([]) and not needs_reboot | bool and not did_reboot | bool %}. No reboot is
          needed, but these services still run replaced libraries; a reboot that restarts them with the same checks
          (with the user's yes): -e reboot=always{% endif %}
      vars:
        did_reboot: "{{ hm_do_reboot | bool and not ansible_check_mode }}"
        planned_migrate: "{{ by_action.migrate | default([]) | map(attribute='vmid') | list }}"
        planned_ha: "{{ by_action.ha | default([]) | map(attribute='vmid') | list }}"

    # Ansible renders fail_msg even when the assertion holds: everything in it has a default
    - name: No unit failed after the reboot (the guests are back)
      ansible.builtin.assert:
        that: hm_reboot_new_failed | default([]) | length == 0
        fail_msg: >-
          {{ hm_reboot_failed_msg | default('') }}. {{ pve_node }} was rebooted and its guests are back; check
          `journalctl -b -u <unit>` on it.
      when: hm_reboot_new_failed is defined
