# Ubuntu release upgrade with do-release-upgrade, one release per run (GitHub issue #88): LTS to the next LTS
# (e.g. 22.04 jammy → 24.04 noble), never two at once.
#
#   ansible-playbook playbooks/dist-upgrade-ubuntu.yml -e target=<host> -e target_release=<codename> --check
#   ansible-playbook playbooks/dist-upgrade-ubuntu.yml -e target=<host> -e target_release=<codename> \
#       -e hm_scripts=$HM/scripts [-e snapshot=false] [-e held_ok=true] [-e allow_non_lts=true]
#       [-e reboot=false] [-e dist_upgrade_min_free_mb=3000]
#
# Ubuntu decides what comes next: target_release must be the release `do-release-upgrade -c` offers. With
# Prompt=lts (/etc/update-manager/release-upgrades, set by the upgrade; allow_non_lts=true: Prompt=normal) that is
# the next LTS only, and only from its first point release (24.04.1); before that, wait. No list of codenames here.
#
# --check (the guard lets it run without asking) is the pre-flight only, on every target, changing nothing but the
# package lists: Ubuntu (Debian: dist-upgrade-debian.yml), not a Proxmox node, ubuntu-release-upgrader-core
# installed, free space (default 3000 MB on / and /var, 200 MB on /boot), the current release fully patched
# (patch-linux.yml first), dpkg consistent (dpkg --audit), sshd -t passes, no held packages (held_ok=true), and,
# when Prompt already has the value the run needs, that do-release-upgrade offers target_release. Without --check
# the guard asks.
#
# Then one host at a time (serial 1, stop at the first failure): Prompt set and the offer checked again (both
# put back if it doesn't match), a snapshot (snapshot=true by default: pve_snapshot.py / lxd_snapshot.py for hosts
# with lxd_host; needs hm_scripts), a backup of the APT, SSH, PAM/NSS, SSSD, Kerberos, sudo and update-manager
# configuration to /root/hm-dist-upgrade-<from>-<date>.tar.gz and the installed package list next to it (.packages),
# then `do-release-upgrade -f DistUpgradeViewNonInteractive` in a transient systemd unit: it survives an sshd
# restart, and with no SSH session of its own do-release-upgrade starts no second sshd on port 1022 (logs:
# /var/log/hm-dist-upgrade.log, /var/log/dist-upgrade/). It disables third-party sources itself and keeps local
# configuration (the maintainer's version saved as *.dpkg-dist). do-release-upgrade has no reliable dry run, so
# what it removed is compared with the package list afterwards: a removed package matching autoremove_protect
# (the list of patch-linux.yml) fails the run before the reboot, with the snapshot to roll back to. After it:
# the new release on disk, dpkg --audit, sshd -t (before the reboot: a broken sshd would lock Ansible out), the
# reboot (reboot=false: none), the release now reported, health_services, and no unit failed that didn't before
# (failed_units_ignore, lxc_failed_units_ignore). Removed packages, packages left for autoremove, disabled
# sources and *.dpkg-dist files are reported, not touched. Remove the snapshot after a good run (the user's yes).
- name: Pre-flight for an Ubuntu release upgrade (changes nothing but the package lists)
  hosts: "{{ target | default('__no_target__') | replace(',', ':') }}:!windows:!appliances:!qnap"
  gather_facts: true
  become: true
  any_errors_fatal: true   # one host not ready: nothing changes anywhere
  vars:
    hm_from: "{{ ansible_facts.distribution_release | default('') }}"
    hm_prompt: "{{ 'normal' if allow_non_lts | default(false) | bool else 'lts' }}"
  tasks:
    - name: target and target_release are required
      ansible.builtin.assert:
        that: target is defined and target | length > 0 and target_release is defined and target_release | length > 0
        fail_msg: "Pass -e target=<host> -e target_release=<codename> (the release do-release-upgrade offers)."
      run_once: true

    - name: Ubuntu, not a Proxmox node
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - target_release != hm_from
          - not (patch_requires_approval | default(false) | bool)
          - "'proxmox_nodes' not in group_names"
        fail_msg: >-
          {{ inventory_hostname }}: {{ ansible_facts.distribution }} {{ hm_from }}{{
          (' — only Ubuntu (Debian: dist-upgrade-debian.yml)') if ansible_facts.distribution != 'Ubuntu'
          else (' — not a Proxmox node') if patch_requires_approval | default(false) | bool or 'proxmox_nodes' in group_names
          else (' — already on ' ~ target_release) }}

    - name: Free space on /, /var and /boot (MB)
      ansible.builtin.shell: for d in / /var /boot; do [ -d "$d" ] && df -Pm "$d" | tail -n +2; done; true
      register: hm_df
      changed_when: false
      check_mode: false

    - name: Refresh the package lists
      ansible.builtin.command: apt-get -q update
      changed_when: false
      check_mode: false

    - name: Pending updates of the current release
      ansible.builtin.shell: apt-get -s -o Debug::NoLocking=1 dist-upgrade | grep -c '^Inst ' || true
      register: hm_pending
      changed_when: false
      check_mode: false

    - name: dpkg consistency (dpkg --audit)
      ansible.builtin.command: dpkg --audit
      register: hm_audit
      changed_when: false
      check_mode: false

    - name: Held packages
      ansible.builtin.command: apt-mark showhold
      register: hm_held
      changed_when: false
      check_mode: false

    - name: sshd configuration (sshd -t)
      ansible.builtin.command: sshd -t
      register: hm_sshd
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Release upgrade prompt (/etc/update-manager/release-upgrades)
      ansible.builtin.shell: |
        command -v do-release-upgrade >/dev/null || { echo missing; exit 0; }
        sed -n 's/^[[:space:]]*Prompt[[:space:]]*=[[:space:]]*//p' /etc/update-manager/release-upgrades 2>/dev/null | tail -n 1
      register: hm_prompt_now
      changed_when: false
      check_mode: false

    - name: The release do-release-upgrade offers
      ansible.builtin.shell: do-release-upgrade -c 2>&1 || true
      register: hm_offer
      changed_when: false
      check_mode: false
      when: hm_prompt_now.stdout | trim == hm_prompt

    - name: Findings
      ansible.builtin.set_fact:
        hm_offered: "{{ (hm_offer.stdout | default('') | regex_search(\"New release '([a-z]+)' available\", '\\1') or [''])[0] }}"
        hm_preflight: >-
          {%- set out = [] -%}
          {%- for line in hm_df.stdout_lines | unique if line.split() | length >= 6 -%}
            {%- set f = line.split() -%}
            {%- set need = 200 if f[5] == '/boot' else (dist_upgrade_min_free_mb | default(3000)) -%}
            {%- if f[3] | int < need | int -%}{%- set _ = out.append(f[5] ~ ': ' ~ f[3] ~ ' MB free, needs ' ~ need) -%}{%- endif -%}
          {%- endfor -%}
          {%- if hm_prompt_now.stdout | trim == 'missing' -%}
            {%- set _ = out.append('do-release-upgrade is missing: install ubuntu-release-upgrader-core (patch-linux.yml or apt)') -%}
          {%- endif -%}
          {%- if hm_pending.stdout | trim | int > 0 -%}
            {%- set _ = out.append(hm_pending.stdout | trim ~ ' updates of ' ~ hm_from ~ ' pending: run patch-linux.yml first') -%}
          {%- endif -%}
          {%- if hm_audit.stdout | trim | length > 0 -%}
            {%- set _ = out.append('dpkg --audit reports problems: ' ~ hm_audit.stdout | trim | truncate(200)) -%}
          {%- endif -%}
          {%- if hm_held.stdout_lines | select | list and not held_ok | default(false) | bool -%}
            {%- set _ = out.append('held packages (held_ok=true keeps them held): ' ~ hm_held.stdout_lines | select | join(', ')) -%}
          {%- endif -%}
          {%- if hm_sshd.rc != 0 -%}
            {%- set _ = out.append('sshd -t fails: ' ~ (hm_sshd.stderr | trim | truncate(200))) -%}
          {%- endif -%}
          {{ out }}

    - name: Offered release
      ansible.builtin.set_fact:
        hm_preflight: >-
          {{ hm_preflight + ['do-release-upgrade offers ' ~ (hm_offered or 'nothing') ~ ', not ' ~ target_release
             ~ ((' (Prompt=lts: the next LTS is offered from its first point release; allow_non_lts=true for an interim'
                 ~ ' release)') if hm_prompt == 'lts' else '')] }}
      when:
        - hm_prompt_now.stdout | trim == hm_prompt
        - hm_offered != target_release

    - name: Pre-flight passed
      ansible.builtin.assert:
        that: hm_preflight | length == 0
        fail_msg: >-
          {{ inventory_hostname }} ({{ hm_from }} → {{ target_release }}) is not ready: {{ hm_preflight | join('; ') }}.
          Nothing was changed.

    - name: Snapshot needs the skill's scripts
      ansible.builtin.assert:
        that: hm_scripts is defined
        fail_msg: "Pass -e hm_scripts=<skill dir>/scripts for the snapshot (or -e snapshot=false: the user's yes)."
      run_once: true
      when: snapshot | default(true) | bool

    - name: Can it be snapshotted? (pve_snapshot.py / lxd_snapshot.py check, read-only)
      ansible.builtin.command:
        argv: >-
          {{ (['python3', hm_scripts ~ '/lxd_snapshot.py', 'check', inventory_hostname] if lxd_host is defined
              else ['python3', hm_scripts ~ '/pve_snapshot.py', 'check', (proxmox_vmid | default(inventory_hostname_short)) | string]
                   + (['--site', hm_site] if hm_site else [])) }}
        chdir: "{{ playbook_dir }}/../.."
      vars:
        hm_site: "{{ group_names | select('match', '^site_') | map('regex_replace', '^site_', '') | first | default('') }}"
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      when: snapshot | default(true) | bool

    - name: Ready
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ hm_from }} → {{ target_release }} ready{{
          (' (Prompt=' ~ (hm_prompt_now.stdout | trim or 'unset') ~ ': the upgrade sets Prompt=' ~ hm_prompt
           ~ ' and checks the offer then)') if hm_prompt_now.stdout | trim != hm_prompt else '' }}{{
          ' (check mode: nothing changed)' if ansible_check_mode else '' }}.

- name: Ubuntu release upgrade
  hosts: "{{ target | default('__no_target__') | replace(',', ':') }}:!windows:!appliances:!qnap"
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files: [vars/patch-lists.yml]   # hm_autoremove_protect, lxc_failed_units_ignore
  vars:
    snapshot: true
    reboot: true
    hm_prompt: "{{ 'normal' if allow_non_lts | default(false) | bool else 'lts' }}"
  tasks:
    - name: Check mode ends after the pre-flight
      ansible.builtin.meta: end_play
      when: ansible_check_mode

    # fixed once: the release changes during the run, and now() would give each task another name
    - name: Release, snapshot and backup names
      ansible.builtin.set_fact:
        hm_from: "{{ ansible_facts.distribution_release }}"
        snapshot_name: "{{ snapshot_name | default('predistupgrade-' ~ now().strftime('%Y%m%d')) }}"
        hm_backup: "/root/hm-dist-upgrade-{{ ansible_facts.distribution_release }}-{{ now().strftime('%Y%m%d-%H%M') }}"

    - name: Prompt={{ hm_prompt }} and the offer
      block:
        - name: Current prompt
          ansible.builtin.slurp:
            src: /etc/update-manager/release-upgrades
          register: hm_prompt_file

        - name: Set Prompt={{ hm_prompt }}
          ansible.builtin.lineinfile:
            path: /etc/update-manager/release-upgrades
            regexp: '^\s*Prompt\s*='
            line: "Prompt={{ hm_prompt }}"

        - name: The release do-release-upgrade offers
          ansible.builtin.shell: do-release-upgrade -c 2>&1 || true
          register: hm_offer
          changed_when: false

        - name: It offers {{ target_release }}
          ansible.builtin.assert:
            that: hm_offered == target_release
            fail_msg: >-
              do-release-upgrade offers {{ hm_offered or 'nothing' }} with Prompt={{ hm_prompt }}, not {{ target_release }}
              ({{ hm_offer.stdout_lines | last | default('') }}). The prompt was put back; nothing was upgraded.
          vars:
            hm_offered: "{{ (hm_offer.stdout | regex_search(\"New release '([a-z]+)' available\", '\\1') or [''])[0] }}"
      rescue:
        - name: Put the prompt back
          ansible.builtin.copy:
            dest: /etc/update-manager/release-upgrades
            content: "{{ hm_prompt_file.content | b64decode }}"
            mode: "0644"
          when: hm_prompt_file.content is defined

        - name: Stop here
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('checking the offered release failed') }}"

    - name: Failed systemd units before the upgrade
      ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain
      register: failed_before
      changed_when: false

    - name: Snapshot
      ansible.builtin.command:
        argv: >-
          {{ (['python3', hm_scripts ~ '/lxd_snapshot.py', 'create', inventory_hostname] if lxd_host is defined
              else ['python3', hm_scripts ~ '/pve_snapshot.py', 'create', (proxmox_vmid | default(inventory_hostname_short)) | string]
                   + (['--site', hm_site] if hm_site else []))
             + ['--name', snapshot_name] }}
        chdir: "{{ playbook_dir }}/../.."
      vars:
        hm_site: "{{ group_names | select('match', '^site_') | map('regex_replace', '^site_', '') | first | default('') }}"
      delegate_to: localhost
      become: false
      register: snap
      changed_when: "'done' in snap.stdout"
      when: snapshot | bool

    - name: Back up the configuration and the installed package list
      ansible.builtin.shell: |
        set -e
        list=""
        for p in /etc/apt /etc/ssh /etc/pam.d /etc/nsswitch.conf /etc/sssd /etc/krb5.conf /etc/krb5.conf.d \
                 /etc/sudoers /etc/sudoers.d /etc/security /etc/update-manager /etc/netplan; do
          [ -e "$p" ] && list="$list ${p#/}"
        done
        tar -C / -czf {{ hm_backup }}.tar.gz $list
        dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' | awk '$1 == "ii" {print $2}' | sort -u > {{ hm_backup }}.packages
        chmod 600 {{ hm_backup }}.tar.gz {{ hm_backup }}.packages

    - name: No earlier upgrade unit left
      ansible.builtin.command: systemctl reset-failed hm-dist-upgrade
      changed_when: false
      failed_when: false

    # A transient unit: the upgrade restarts sshd and may drop this connection; it keeps running regardless.
    # No SSH session of its own, so do-release-upgrade starts no second sshd on port 1022; no screen either.
    - name: Upgrade to {{ target_release }} (do-release-upgrade; /var/log/hm-dist-upgrade.log, /var/log/dist-upgrade/)
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=hm-dist-upgrade
          - --description=homelab-manager Ubuntu release upgrade
          - --property=StandardOutput=append:/var/log/hm-dist-upgrade.log
          - --property=StandardError=append:/var/log/hm-dist-upgrade.log
          - --setenv=DEBIAN_FRONTEND=noninteractive
          - --setenv=APT_LISTCHANGES_FRONTEND=none
          - --setenv=NEEDRESTART_MODE=a
          - --setenv=RELEASE_UPGRADER_NO_SCREEN=1
          - do-release-upgrade
          - -f
          - DistUpgradeViewNonInteractive
      register: hm_started

    # a unit that finished well is unloaded (inactive, success); a failed one stays (failed, exit-code)
    - name: Wait for the upgrade (up to dist_upgrade_timeout, default 5400 s)
      ansible.builtin.command: systemctl show hm-dist-upgrade -p ActiveState -p Result
      register: hm_unit
      changed_when: false
      until: (hm_unit.stdout_lines | select('match', '^ActiveState=') | first | default('=')).split('=')[1]
             not in ['activating', 'active', 'reloading', 'deactivating']
      retries: "{{ ((dist_upgrade_timeout | default(5400) | int) / 20) | round(0, 'ceil') | int }}"
      delay: 20

    - name: Release on disk
      ansible.builtin.shell: . /etc/os-release && echo "$VERSION_CODENAME"
      register: hm_on_disk
      changed_when: false

    - name: The upgrade succeeded
      ansible.builtin.assert:
        that:
          - "'Result=success' in hm_unit.stdout_lines"
          - "'ActiveState=failed' not in hm_unit.stdout_lines"
          - hm_on_disk.stdout | trim == target_release
        fail_msg: >-
          The upgrade to {{ target_release }} failed ({{ hm_unit.stdout_lines | join(' ') }}, /etc/os-release:
          {{ hm_on_disk.stdout | trim }}): see /var/log/hm-dist-upgrade.log and /var/log/dist-upgrade/main.log on
          {{ inventory_hostname }}. Not rebooted. Fix it there (`dpkg --configure -a`, `apt-get -f install`) or roll
          back to the snapshot.

    - name: Forget the finished unit
      ansible.builtin.command: systemctl reset-failed hm-dist-upgrade
      changed_when: false
      failed_when: false

    - name: Packages the upgrade removed
      ansible.builtin.shell: |
        dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' | awk '$1 == "ii" {print $2}' | sort -u \
          | comm -23 {{ hm_backup }}.packages -
      register: hm_removed
      changed_when: false

    - name: It removed nothing protected
      ansible.builtin.assert:
        that: hm_protected | length == 0
        fail_msg: >-
          The upgrade to {{ target_release }} removed {{ hm_protected | join(', ') }} (autoremove_protect:
          authentication, SSH, sudo, networking). Not rebooted: install what replaces them now, or roll back to the
          snapshot.
      vars:
        hm_protected: >-
          {%- set out = [] -%}
          {%- for pkg in hm_removed.stdout_lines | map('regex_replace', ':.*$', '') -%}
            {%- for pat in autoremove_protect | default(hm_autoremove_protect, true)
                if pkg is match('^' ~ (pat | regex_escape | replace('\*', '.*') | replace('\?', '.')) ~ '$') -%}
              {%- set _ = out.append(pkg) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out | unique }}

    - name: dpkg consistency after the upgrade
      ansible.builtin.command: dpkg --audit
      register: hm_audit_after
      changed_when: false
      failed_when: hm_audit_after.stdout | trim | length > 0

    - name: sshd configuration still valid (before the reboot)
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: The maintainer's configuration files left to review (*.dpkg-dist, *.ucf-dist)
      ansible.builtin.shell: find /etc \( -name '*.dpkg-dist' -o -name '*.ucf-dist' -o -name '*.dpkg-new' \) -newer {{ hm_backup }}.tar.gz 2>/dev/null || true
      register: hm_dist_files
      changed_when: false

    - name: Third-party sources do-release-upgrade disabled
      ansible.builtin.shell: >-
        grep -rlE 'disabled on upgrade to|^Enabled: *no' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
      register: hm_disabled
      changed_when: false

    - name: Reboot into {{ target_release }}
      ansible.builtin.reboot:
        reboot_timeout: 900
        msg: "Reboot by homelab-manager after the release upgrade to {{ target_release }}"
      when: reboot | bool

    - name: Wait until the boot has finished
      ansible.builtin.command: systemctl is-system-running
      register: hm_boot_state
      changed_when: false
      failed_when: false
      until: hm_boot_state.stdout | trim not in ['initializing', 'starting']
      retries: "{{ ((health_timeout | default(300) | int) / 10) | round(0, 'ceil') | int }}"
      delay: 10
      when: reboot | bool

    - name: Facts after the upgrade
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Now on {{ target_release }}
      ansible.builtin.assert:
        that: ansible_facts.distribution_release == target_release
        fail_msg: "{{ inventory_hostname }} reports {{ ansible_facts.distribution_release }}, not {{ target_release }}."

    - name: Required services are active
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: svc
      until: svc.status.ActiveState | default('') not in ['activating', 'reloading', 'deactivating']
      retries: "{{ ((health_timeout | default(300) | int) / 10) | round(0, 'ceil') | int }}"
      delay: 10
      failed_when: svc.status.ActiveState | default('') != "active"
      loop: "{{ health_services | default([]) }}"

    - name: Failed systemd units after the upgrade
      ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain
      register: failed_after
      changed_when: false

    - name: No new failed units
      ansible.builtin.assert:
        that: hm_new_failed | length == 0
        fail_msg: >-
          New failed units: {{ hm_new_failed | join(', ') }}. Check `journalctl -b -u <unit>`; a unit that can't
          work in this release may need its package replaced. The snapshot is still there.
      vars:
        hm_new_failed: >-
          {{ failed_after.stdout_lines | select | map('split') | map('first') | list
             | difference(failed_before.stdout_lines | select | map('split') | map('first') | list)
             | difference(failed_units_ignore | default([], true)
                          + (lxc_failed_units_ignore if ansible_facts.virtualization_type | default('') == 'lxc' else [])) }}

    - name: Packages autoremove would remove now (not removed — review, then patch-linux.yml)
      ansible.builtin.shell: >-
        apt-get -s -o Debug::NoLocking=1 autoremove | awk '/^Remv /{sub(/:.*/, "", $2); print $2}'
      register: hm_autoremove
      changed_when: false

    - name: Result
      ansible.builtin.debug:
        msg:
          upgraded: "{{ hm_from }} → {{ ansible_facts.distribution_release }} ({{ ansible_facts.distribution_version }})"
          rebooted: "{{ reboot | bool }}"
          snapshot: "{{ snapshot_name if snapshot | bool else 'none' }}"
          backup: "{{ hm_backup }}.tar.gz"
          removed: "{{ hm_removed.stdout_lines }}"
          sources_disabled: "{{ hm_disabled.stdout_lines }}"
          review_config: "{{ hm_dist_files.stdout_lines }}"
          autoremovable: "{{ hm_autoremove.stdout_lines }}"
