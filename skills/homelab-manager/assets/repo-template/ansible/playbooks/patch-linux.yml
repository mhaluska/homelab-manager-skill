# Rolling Linux patching with health checks.
#
#   ansible-playbook playbooks/patch-linux.yml -e target=<group|host> [-e security_only=true]
#       [-e reboot=never|if_required|always] [-e restart_services=true]
#       [-e snapshot=true -e hm_scripts=$HM/scripts [-e snapshot_missing=skip]] [-e autoremove=false] [-e purge=true]
#       [-e clean_cache=true] [-e patch_min_free_mb=500]
#       [-e pre_hook=… -e post_hook=… -e health_check=…] [-e order=vip_holder_last -e vip=<ip>]
#
# Free space first (GitHub issue #57): before any host is snapshotted or patched, every target needs
# patch_min_free_mb (default 500) free on / and /var and patch_min_free_boot_mb (default 100) on a separate
# /boot, else the run stops listing them: a full disk would fail one host's update mid-batch and leave the
# others updated but not rebooted or checked. -e clean_cache=true first cleans the package cache
# (apt-get clean / dnf clean all) on hosts below it.
# Safe defaults: stop at the first failure, NO reboots. Batch size: -e patch_serial=<n|n%>, else
# ansible.patch_serial in homelab.yaml, else 1. Always one host at a time (and a larger -e patch_serial is
# refused) when a target is in a `clusters:` group, has patch_requires_approval, or the run has cluster
# settings (pre_hook, post_hook, health_check, order).
# reboot: never (default), if_required (old name: allow_reboot=true) or always (e.g. an app cluster that
# should come back from a clean boot). A reboot is required for a newer kernel than the running one (also on
# plain Debian, which has no /var/run/reboot-required), needs-restarting -r or the reboot-required flag.
# Services still using replaced binaries or libraries are reported as restart_pending; restart_services=true
# restarts them (except restart_exclude) when the host is not rebooted anyway.
# snapshot=true: first checks that every target can be snapshotted (pve_snapshot.py / lxd_snapshot.py check)
# and refuses otherwise, before anything is snapshotted or patched; -e snapshot_missing=skip patches those
# without one. Hosts with the host var lxd_host are LXD/Incus instances (e.g. on a NAS): lxd_snapshot.py.
# Proxmox guests of another site (their site_<name> group, sites: in homelab.yaml) use that site's Proxmox.
# Then a disk-only Proxmox snapshot of each guest (pve_snapshot.py create, name snapshot_name,
# default prepatch-<date>) right before it is updated; the guest is the inventory short name or the host var
# proxmox_vmid. Needs hm_scripts (the skill's scripts directory). Remove the snapshots after a successful run
# with pve_snapshot.py delete (the user's yes): they keep growing.
# autoremove (default true): after the reboot (or when there is none) remove packages nothing needs any more
# (apt/dnf autoremove). Only then can the kernel that was running during the update go, so old kernels
# don't pile up. It is simulated first and skipped on a host (reported, not failed) when it would remove a
# package matching autoremove_protect (authentication, NSS/PAM, sudo, SSH, systemd, networking: e.g. the
# SSSD stack left behind by a removed freeipa-client) or more than autoremove_max (default 20) packages;
# set either in group_vars. purge=true also removes the configuration left behind by removed Debian packages (`rc` in
# dpkg -l); off by default, those files may still be wanted.
#
# Clusters (`clusters:` in homelab.yaml): never in parallel, keep serial 1, pass the cluster's settings:
#   pre_hook / post_hook  task files run before/after each node, WITHOUT sudo (kubectl on this Mac: drain/uncordon)
#   health_check          task file run on each node after it is back (with sudo); it retries itself, and a
#                         failure stops the roll, e.g. playbooks/hooks/vrrp-health.yml (keepalived/VRRP)
#   order: vip_holder_last + vip   the node holding the VIP is patched last, so it fails over only once
# Task file paths are relative to ansible/ (as written in homelab.yaml).
# After a reboot the playbook waits until the boot has finished (systemctl is-system-running), and services in
# health_services get time to leave activating/reloading: both up to health_timeout seconds (default 300;
# -e or group_vars). A slow service such as FreeIPA's ipa.service needs 1-2 minutes.
# After each host: no unit may fail that didn't before, except failed_units_ignore (group_vars) and, in LXC
# guests, lxc_failed_units_ignore (kernel-module units that fail on every boot in a container).
# Containers (Docker, Podman) that ran before must run again; Docker containers that are down get one
# restart of containerd and then Docker (an upgraded containerd needs it), else the host fails.
# Packages listed in `patch_exclude` (set it in the group's group_vars, e.g. kubelet/kubeadm/kubectl
# for Kubernetes nodes) are never upgraded: dnf exclude on RHEL, apt hold on Debian.
# Not a play var on purpose — play vars would override group_vars.
# Hosts with patch_requires_approval: true (group_vars/proxmox_nodes.yml) are refused unless listed in
# -e patch_approved=<host,…>.
- name: Order the hosts (order=vip_holder_last puts the node holding the VIP last)
  hosts: "{{ target | default('__no_target__') }}"
  gather_facts: false
  become: false
  vars:
    hm_site: >-
      {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../homelab.yaml', errors='ignore') or '{}') | from_yaml or {} }}
    hm_cluster_hosts: >-
      {%- set out = [] -%}
      {%- for c in hm_site.clusters | default([], true) if c.ansible_group | default('') in groups -%}
        {%- set _ = out.extend(groups[c.ansible_group]) -%}
      {%- endfor -%}
      {{ out }}
    # LXD/Incus instances (host var lxd_host: their LXD/Incus host) are snapshotted with lxd_snapshot.py
    hm_lxd_hosts: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('lxd_host', 'defined')
                      | map(attribute='inventory_hostname') | list }}"
    # the other hosts, per site (their site_<name> group; none = the default site '') → guest for
    # pve_snapshot.py (the host var proxmox_vmid, else the short name): VMIDs are unique only within a site
    hm_snap_by_site: >-
      {%- set out = {} -%}
      {%- for h in ansible_play_hosts_all if h not in hm_lxd_hosts -%}
        {%- set st = hostvars[h].group_names | select('match', '^site_') | map('regex_replace', '^site_', '')
                     | first | default('') -%}
        {%- set _ = out.setdefault(st, {}).update(
              {h: (hostvars[h].proxmox_vmid | default(hostvars[h].inventory_hostname_short)) | string}) -%}
      {%- endfor -%}
      {{ out }}
    # inventory host → why it can't be snapshotted
    hm_snap_bad: >-
      {%- set out = {} -%}
      {%- for res in hm_snap_check.results | default([]) if res.stdout is defined -%}
        {%- set r = res.stdout | from_json -%}
        {%- set why = r.not_a_guest | combine(r.no_snapshot) -%}
        {%- for h, id in hm_snap_by_site[res.item].items() if id in why -%}
          {%- set _ = out.update({h: (res.item ~ ': ' if res.item else '') ~ why[id]}) -%}
        {%- endfor -%}
      {%- endfor -%}
      {%- if hm_lxd_check.stdout is defined -%}
        {%- set r = hm_lxd_check.stdout | from_json -%}
        {%- set _ = out.update(r.not_a_guest | combine(r.no_snapshot)) -%}
      {%- endif -%}
      {{ out }}
    # "<mount> <free> MB free, needs <min>" for each mount of /, /var and /boot short of space (df -Pm)
    hm_low_space: >-
      {%- set out = [] -%}
      {%- for line in hm_df.stdout_lines | default([]) | unique if line.split() | length >= 6 -%}
        {%- set f = line.split() -%}
        {%- set need = (patch_min_free_boot_mb | default(100)) if f[5] == '/boot'
                       else (patch_min_free_mb | default(500)) -%}
        {%- if f[3] | int < need | int and f[5] not in out | map('split') | map('first') -%}
          {%- set _ = out.append(f[5] ~ ' ' ~ f[3] ~ ' MB free, needs ' ~ need) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
    hm_cluster_run: "{{ pre_hook is defined or post_hook is defined or health_check is defined or order is defined }}"
    # hosts that must be patched one at a time: cluster members, guarded hosts, or any host of a cluster run
    hm_one_at_a_time: >-
      {{ ansible_play_hosts_all if hm_cluster_run | bool else
         ansible_play_hosts_all | select('in', hm_cluster_hosts) | list
         + (ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_requires_approval', 'defined')
            | selectattr('patch_requires_approval') | map(attribute='inventory_hostname') | list) }}
  tasks:
    - name: Refuse to run without an explicit target
      ansible.builtin.assert:
        that: target is defined and target | length > 0
        fail_msg: "Pass -e target=<group or host>."
      run_once: true

    - name: Clusters are patched one host at a time
      ansible.builtin.assert:
        that: patch_serial is not defined or patch_serial | string == '1' or hm_one_at_a_time | length == 0
        fail_msg: >-
          patch_serial={{ patch_serial | default('') }} with cluster or guarded hosts ({{ hm_one_at_a_time | unique | join(', ') }}):
          patch them in their own run with serial 1.
      run_once: true

    # Before any batch (GitHub issue #57): a host that runs out of space mid-update stops the run with the
    # rest of its batch updated but not rebooted, restarted or checked
    - name: Free space on /, /var and /boot (MB)
      ansible.builtin.shell: &hm_df_cmd |
        for d in / /var /boot; do [ -d "$d" ] && df -Pm "$d" | tail -n +2; done; true
      register: hm_df
      changed_when: false
      check_mode: false

    - name: Mounts short of space
      ansible.builtin.set_fact:
        hm_space_short: "{{ hm_low_space }}"

    - name: Clean the package cache where space is short (clean_cache=true)
      ansible.builtin.shell: |
        if command -v apt-get >/dev/null 2>&1; then apt-get clean
        elif command -v dnf >/dev/null 2>&1; then dnf clean all
        elif command -v yum >/dev/null 2>&1; then yum clean all
        fi
      become: true
      register: hm_cleaned
      when: clean_cache | default(false) | bool and hm_space_short | length > 0

    - name: Free space after cleaning
      ansible.builtin.shell: *hm_df_cmd
      register: hm_df
      changed_when: false
      check_mode: false
      when: hm_cleaned is changed

    - name: Mounts still short of space
      ansible.builtin.set_fact:
        hm_space_short: "{{ hm_low_space }}"
      when: hm_cleaned is changed

    - name: Refuse if a target is short of space (nothing was snapshotted or patched yet)
      ansible.builtin.assert:
        that: short | length == 0
        fail_msg: >-
          Not enough free space: {{ short | join('; ') }}. Nothing was snapshotted or patched. Free space there
          (-e clean_cache=true cleans the package cache first), or leave these hosts out of the target.
      vars:
        short: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts if hostvars[h].hm_space_short | default([]) | length > 0 -%}
            {%- set _ = out.append(h ~ ' (' ~ hostvars[h].hm_space_short | join(', ') ~ ')') -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    # Before any batch (GitHub issue #49): one guest that can't be snapshotted would otherwise stop the run
    # after others already got their snapshot
    - name: snapshot=true needs the skill's scripts
      ansible.builtin.assert:
        that: hm_scripts is defined and (snapshot_missing | default('fail')) in ['fail', 'skip']
        fail_msg: "Pass -e hm_scripts=<skill dir>/scripts with snapshot=true (pve_snapshot.py); snapshot_missing is fail or skip."
      run_once: true
      when: snapshot | default(false) | bool

    - name: snapshot=true — can every Proxmox guest be snapshotted? (pve_snapshot.py check per site, read-only)
      ansible.builtin.command:
        argv: >-
          {{ ['python3', hm_scripts ~ '/pve_snapshot.py', 'check', '--json'] + (['--site', item] if item else [])
             + hm_snap_by_site[item].values() | unique }}
        chdir: "{{ playbook_dir }}/../.."
      loop: "{{ hm_snap_by_site.keys() | list }}"
      register: hm_snap_check
      failed_when: hm_snap_check.rc not in [0, 1]
      changed_when: false
      check_mode: false
      delegate_to: localhost
      run_once: true
      when: snapshot | default(false) | bool

    - name: snapshot=true — can every LXD/Incus instance be snapshotted? (lxd_snapshot.py check, read-only)
      ansible.builtin.command:
        argv: "{{ ['python3', hm_scripts ~ '/lxd_snapshot.py', 'check', '--json'] + hm_lxd_hosts }}"
        chdir: "{{ playbook_dir }}/../.."
      register: hm_lxd_check
      failed_when: hm_lxd_check.rc not in [0, 1]
      changed_when: false
      check_mode: false
      delegate_to: localhost
      run_once: true
      when: snapshot | default(false) | bool and hm_lxd_hosts | length > 0

    - name: snapshot=true — what the LXD/Incus snapshots won't cover
      ansible.builtin.debug:
        msg: "{{ (hm_lxd_check.stdout | from_json).warnings }}"
      run_once: true
      when: hm_lxd_check.stdout is defined and (hm_lxd_check.stdout | from_json).warnings | length > 0

    - name: snapshot=true — refuse unless every target can be snapshotted (or snapshot_missing=skip)
      ansible.builtin.assert:
        that: hm_snap_bad | length == 0 or (snapshot_missing | default('fail')) == 'skip'
        fail_msg: >-
          Can't snapshot: {% for h, why in hm_snap_bad.items() %}{{ h }} ({{ why }}){{ '; ' if not loop.last }}{%
          endfor %}. Nothing was snapshotted or patched. Leave them out of the target, or patch them without a
          snapshot with -e snapshot_missing=skip (the user's yes). LXD/Incus instances (e.g. on a NAS) need the
          host var lxd_host (references/patching.md).
      run_once: true
      when: snapshot | default(false) | bool

    - name: Hosts patched without a snapshot (snapshot_missing=skip)
      ansible.builtin.set_fact:
        hm_snapshot_skip: "{{ hm_snap_bad[inventory_hostname] | default('') }}"
      when: snapshot | default(false) | bool

    - name: order=vip_holder_last needs the VIP
      ansible.builtin.assert:
        that: vip is defined and vip | length > 0
        fail_msg: "Pass -e vip=<address> with order=vip_holder_last."
      run_once: true
      when: (order | default('')) == 'vip_holder_last'

    - name: Does this node hold the VIP?
      ansible.builtin.shell: ip -o addr show | grep -cF ' {{ vip }}/' || true
      register: hm_vip
      changed_when: false
      check_mode: false
      when: (order | default('')) == 'vip_holder_last'

    - name: Patch order
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "{{ ['hm_patch_order'] + (['hm_one_at_a_time'] if item in hm_one_at_a_time else []) }}"
      loop: "{{ (ansible_play_hosts_all | reject('in', holders) | list) + holders }}"  # keeps inventory order
      vars:
        holders: >-
          {{ ansible_play_hosts_all | map('extract', hostvars)
             | selectattr('hm_vip.stdout', 'defined') | selectattr('hm_vip.stdout', 'ne', '0')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      changed_when: false

- name: Patch Linux hosts
  hosts: hm_patch_order
  # hostvars aren't available here: the first play put one-at-a-time hosts into hm_one_at_a_time
  serial: >-
    {{ 1 if groups.hm_one_at_a_time | default([]) | length > 0
       else patch_serial | default(((lookup('ansible.builtin.file', playbook_dir ~ '/../../homelab.yaml', errors='ignore')
                                     or '{}') | from_yaml or {}).ansible.patch_serial | default(1, true), true) }}
  max_fail_percentage: 0
  any_errors_fatal: true
  become: true
  vars:
    security_only: false
    allow_reboot: false
    reboot: "{{ 'if_required' if allow_reboot | bool else 'never' }}"
    restart_services: false
    snapshot: false
    autoremove: true
    purge: false
    snapshot_name: "prepatch-{{ now().strftime('%Y%m%d') }}"
    # never restarted automatically (a reboot or the user's own step instead): restarting these drops sessions
    restart_exclude: [dbus.service, dbus-broker.service, systemd-logind.service]
    # autoremove never removes these (shell-style patterns) without a look first: losing them can lock Ansible
    # out (GitHub issue #58). Override with autoremove_protect in group_vars; the same list is in check-updates.yml
    hm_autoremove_protect: [sssd*, libsss*, libnss-*, libpam-*, nss-*, pam*, freeipa-*, ipa-*, krb5-*, libkrb5*,
                            realmd, adcli, winbind*, oddjob*, openssh-*, ssh, sudo*, polkit*, systemd*, dbus*,
                            network*, netplan*, ifupdown*, NetworkManager*, dhcp*, isc-dhcp-*, resolvconf,
                            cloud-init, python3, python3-apt, python3-dnf*, chrony*, ntp*]
    # units that can't work in an LXC container (kernel modules, kernel filesystems, audit) and fail on every
    # boot there: not counted as new failures in LXC guests; add your own in group_vars failed_units_ignore
    lxc_failed_units_ignore: [auth-rpcgss-module.service, systemd-modules-load.service, systemd-binfmt.service,
                              proc-sys-fs-binfmt_misc.mount, sys-kernel-config.mount, sys-kernel-debug.mount,
                              sys-kernel-tracing.mount, systemd-journald-audit.socket]

  pre_tasks:
    - name: reboot is never, if_required or always
      ansible.builtin.assert:
        that: reboot in ['never', 'if_required', 'always']
        fail_msg: "reboot={{ reboot }}: use never, if_required or always."
      run_once: true

    - name: Refuse hosts that need their own procedure (patch_requires_approval, e.g. Proxmox nodes)
      ansible.builtin.assert:
        that: guarded | length == 0
        fail_msg: >-
          {{ guarded | join(', ') }} must not be patched by a broad run (Proxmox nodes: patch-proxmox-node.yml).
          Only with the user's yes for exactly these hosts: -e patch_approved={{ guarded | join(',') }}
      vars:
        guarded: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_requires_approval', 'defined')
                     | selectattr('patch_requires_approval') | map(attribute='inventory_hostname')
                     | difference((patch_approved | default('')).split(',')) | list }}"
      run_once: true

    - name: Failed systemd units before patching
      ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain
      register: failed_before
      changed_when: false

    - name: Running containers before patching (Docker, Podman)
      ansible.builtin.shell: |
        for e in docker podman; do
          command -v "$e" >/dev/null 2>&1 || continue
          "$e" ps --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | sed "s/^/$e /"
        done
        true
      changed_when: false
      check_mode: false
      register: containers_before

    - name: Pre-patch snapshot (snapshot=true; LXD/Incus for hosts with lxd_host, else Proxmox)
      ansible.builtin.command:
        argv: >-
          {{ (['python3', hm_scripts ~ '/lxd_snapshot.py', 'create', inventory_hostname] if lxd_host is defined
              else ['python3', hm_scripts ~ '/pve_snapshot.py', 'create', (proxmox_vmid | default(inventory_hostname_short)) | string]
                   + (['--site', hm_site] if hm_site else []))
             + ['--name', snapshot_name] }}
        chdir: "{{ playbook_dir }}/../.."
      vars:
        hm_site: "{{ group_names | select('match', '^site_') | map('regex_replace', '^site_', '') | first | default('') }}"
      delegate_to: localhost
      become: false
      changed_when: "'done' in snap.stdout"
      register: snap
      when: snapshot | bool and hm_snapshot_skip | default('') | length == 0
      check_mode: false

    - name: Cluster pre-hook (drain, maintenance mode, …)
      ansible.builtin.include_tasks:
        file: "{{ [playbook_dir, '..', pre_hook] | path_join }}"  # absolute paths win
        apply:
          become: false
      when: pre_hook is defined

  tasks:
    - name: Installed packages (hold only what exists)
      ansible.builtin.package_facts:
      when: patch_exclude | default([]) | length > 0 and ansible_facts.os_family == "Debian"

    - name: Hold excluded packages (Debian family)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ patch_exclude | default([]) | select('in', ansible_facts.packages | default({})) | list }}"
      when: ansible_facts.os_family == "Debian"

    - name: Update (RHEL family)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: "{{ security_only | bool }}"
        update_only: true
        exclude: "{{ patch_exclude | default([]) }}"
      when: ansible_facts.os_family == "RedHat"
      register: upd_rh

    - name: Update (Debian family)
      ansible.builtin.apt:
        upgrade: "{{ 'yes' if security_only | bool else 'dist' }}"
        update_cache: true
      environment:
        NEEDRESTART_MODE: a
      when: ansible_facts.os_family == "Debian"
      register: upd_deb

    - name: Reboot required, services still running replaced code
      ansible.builtin.include_tasks: tasks/restart-check.yml

    # A Proxmox LXC container rebooted from inside can end up stopped instead of running (GitHub issue #59):
    # with hm_scripts it gets lxc_reboot_timeout (default 300 s), then is started once through the API
    # (pve_guest.py start, provisioning token) — the reboot was approved — instead of a blind 900 s wait.
    - name: Reboot (reboot=always, or if_required and needed)
      when: reboot == 'always' or (reboot == 'if_required' and needs_reboot | bool)
      vars:
        hm_pve_lxc: >-
          {{ ansible_facts.virtualization_type | default('') == 'lxc' and lxd_host is not defined
             and hm_scripts is defined }}
      block:
        - name: Reboot
          ansible.builtin.reboot:
            reboot_timeout: "{{ (lxc_reboot_timeout | default(300)) if hm_pve_lxc | bool else 900 }}"
            msg: "Reboot by homelab-manager patching"
          register: rebooted
      rescue:
        - name: The reboot did not come back (not a Proxmox LXC guest, or no hm_scripts to check it)
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('reboot failed') }}"
          when: not hm_pve_lxc | bool

        - name: LXC guest stopped after its reboot? Start it (pve_guest.py start)
          ansible.builtin.command:
            argv: >-
              {{ ['python3', hm_scripts ~ '/pve_guest.py', 'start', (proxmox_vmid | default(inventory_hostname_short)) | string]
                 + (['--site', hm_site] if hm_site else []) }}
            chdir: "{{ playbook_dir }}/../.."
          vars:
            hm_site: "{{ group_names | select('match', '^site_') | map('regex_replace', '^site_', '') | first | default('') }}"
          delegate_to: localhost
          become: false
          register: hm_lxc_start
          changed_when: "'started' in hm_lxc_start.stdout"

        - name: Wait for the guest after starting it
          ansible.builtin.wait_for_connection:
            timeout: "{{ lxc_reboot_timeout | default(300) }}"

        - name: Rebooted (by starting it again)
          ansible.builtin.set_fact:
            rebooted: {rebooted: true, started_by_api: "{{ hm_lxc_start is changed }}"}

    # Units still starting are neither active nor failed yet: wait for the boot to finish (GitHub issue #53).
    # Polled, not --wait: systemd 239 (RHEL 8) doesn't have it. Running out of time is not a failure here;
    # the checks below report what is not up.
    - name: Wait until the boot has finished (after a reboot)
      ansible.builtin.command: systemctl is-system-running
      register: hm_boot_state
      changed_when: false
      failed_when: false
      until: hm_boot_state.stdout | trim not in ['initializing', 'starting']
      retries: "{{ ((health_timeout | default(300) | int) / 10) | round(0, 'ceil') | int }}"
      delay: 10
      when: rebooted.rebooted | default(false)

    - name: Restart services still running replaced code (only with restart_services=true)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ restart_pending | difference(restart_exclude) }}"
      when: restart_services | bool and not (rebooted.rebooted | default(false))

    - name: Services left to restart
      ansible.builtin.set_fact:
        restart_pending: >-
          {{ [] if (rebooted.rebooted | default(false))
             else (restart_pending | intersect(restart_exclude) if restart_services | bool else restart_pending) }}

    # After the reboot: the kernel that was running during the update is no longer protected (GitHub issue #46).
    # Simulated first (GitHub issue #58): a package removed earlier (dpkg `rc`, e.g. freeipa-client) leaves its
    # dependencies marked automatic, and autoremove would take the whole SSSD/NSS/PAM stack with it.
    - name: What autoremove would remove (Debian family)
      ansible.builtin.shell: >-
        set -o pipefail; apt-get -s -o Debug::NoLocking=1 autoremove | awk '/^Remv /{sub(/:.*/, "", $2); print $2}'
      args:
        executable: /bin/bash
      register: hm_autoremove_deb
      changed_when: false
      check_mode: false
      when: autoremove | bool and ansible_facts.os_family == "Debian"

    - name: What autoremove would remove (RHEL family)
      ansible.builtin.command: dnf -q repoquery --unneeded   # name-[epoch:]version-release.arch (dnf 4 and 5)
      register: hm_autoremove_rh
      changed_when: false
      check_mode: false
      when: autoremove | bool and ansible_facts.os_family == "RedHat"

    - name: Autoremove only when it touches nothing protected
      ansible.builtin.set_fact:
        hm_autoremove_skip: >-
          {%- if hm_protected | length > 0 -%}
            would remove protected packages {{ hm_protected | join(', ') }}
          {%- elif hm_removable | length > (autoremove_max | default(20) | int) -%}
            would remove {{ hm_removable | length }} packages (autoremove_max {{ autoremove_max | default(20) }})
          {%- endif -%}
        hm_autoremove_list: "{{ hm_removable }}"
      vars:
        hm_removable: >-
          {{ ((hm_autoremove_deb.stdout_lines | default([]))
              + (hm_autoremove_rh.stdout_lines | default([]) | map('regex_replace', '^(.+)-(\d+:)?[^-]+-[^-]+$', '\1')))
             | map('trim') | select | unique | list }}
        hm_protected: >-
          {%- set out = [] -%}
          {%- for pkg in hm_removable -%}
            {%- for pat in autoremove_protect | default(hm_autoremove_protect, true)
                if pkg is match('^' ~ (pat | regex_escape | replace('\*', '.*') | replace('\?', '.')) ~ '$') -%}
              {%- set _ = out.append(pkg) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out | unique | list }}
      when: autoremove | bool

    - name: Autoremove skipped — review these packages before removing them by hand
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: autoremove skipped, it {{ hm_autoremove_skip }}: {{ hm_autoremove_list | join(' ') }}"
      when: autoremove | bool and hm_autoremove_skip | length > 0

    - name: Remove packages nothing needs any more (Debian family)
      ansible.builtin.apt:
        autoremove: true
        purge: "{{ purge | bool }}"
      when: autoremove | bool and ansible_facts.os_family == "Debian" and hm_autoremove_skip | length == 0
        and hm_autoremove_list | length > 0

    - name: Remove packages nothing needs any more (RHEL family)
      ansible.builtin.dnf:
        autoremove: true
      when: autoremove | bool and ansible_facts.os_family == "RedHat" and hm_autoremove_skip | length == 0
        and hm_autoremove_list | length > 0

    - name: Configuration left by removed packages (purge=true)
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${db:Status-Abbrev}\t${Package}\n"]
      register: hm_dpkg_status
      changed_when: false
      when: purge | bool and ansible_facts.os_family == "Debian"

    - name: Purge it (purge=true)
      ansible.builtin.command:
        argv: "{{ ['dpkg', '--purge'] + leftovers }}"
      vars:
        leftovers: "{{ hm_dpkg_status.stdout_lines | select('match', '^rc') | map('split', '\t') | map('last') | list }}"
      when: purge | bool and ansible_facts.os_family == "Debian" and leftovers | length > 0

  post_tasks:
    - name: Required services are active
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: svc
      # still starting (or restarting): wait up to health_timeout, then it must be active (GitHub issue #53)
      until: svc.status.ActiveState | default('') not in ['activating', 'reloading', 'deactivating']
      retries: "{{ ((health_timeout | default(300) | int) / 10) | round(0, 'ceil') | int }}"
      delay: 10
      failed_when: svc.status.ActiveState | default('') != "active"
      loop: "{{ health_services | default([]) }}"

    # An update can stop containers without failing a unit, e.g. containerd upgraded after dockerd restarted
    # ("shim was started through the deprecated API"): GitHub issue #50. Containers get time to come back.
    - name: Containers that ran before run again
      ansible.builtin.shell: |
        for e in docker podman; do
          command -v "$e" >/dev/null 2>&1 || continue
          "$e" ps --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | sed "s/^/$e /"
        done
        true
      changed_when: false
      check_mode: false
      register: containers_after
      until: containers_before.stdout_lines | difference(containers_after.stdout_lines) | length == 0
      retries: "{{ container_retries | default(10) }}"
      delay: 6
      failed_when: false
      when: containers_before.stdout_lines | length > 0

    - name: Docker containers down — restart containerd, then Docker (once)
      ansible.builtin.shell: |
        systemctl restart containerd
        systemctl restart docker
      register: hm_docker_restarted
      when: >-
        containers_before.stdout_lines | difference(containers_after.stdout_lines | default([]))
        | select('match', 'docker ') | list | length > 0

    - name: Containers after restarting Docker
      ansible.builtin.shell: |
        for e in docker podman; do
          command -v "$e" >/dev/null 2>&1 || continue
          "$e" ps --format '{{ '{{' }}.Names{{ '}}' }}' 2>/dev/null | sed "s/^/$e /"
        done
        true
      changed_when: false
      check_mode: false
      register: containers_after_restart
      until: containers_before.stdout_lines | difference(containers_after_restart.stdout_lines) | length == 0
      retries: "{{ container_retries | default(10) }}"
      delay: 6
      failed_when: false
      when: hm_docker_restarted is changed

    - name: Why the containers stopped
      ansible.builtin.shell: >-
        {{ item.split(' ')[0] }} inspect -f '{{ '{{' }}.State.Status{{ '}}' }} ({{ '{{' }}.State.ExitCode{{ '}}' }})
        {{ '{{' }}.State.Error{{ '}}' }}' {{ item.split(' ')[1] | quote }}
      loop: "{{ hm_stopped }}"
      register: hm_stopped_why
      changed_when: false
      failed_when: false
      vars:
        hm_stopped: >-
          {{ containers_before.stdout_lines | difference(
               (containers_after_restart if hm_docker_restarted is changed else containers_after).stdout_lines
               | default([])) }}

    - name: No containers stopped
      ansible.builtin.assert:
        that: hm_stopped_why.results | default([]) | length == 0
        fail_msg: >-
          Containers that ran before patching don't run now{{ ' (also after restarting containerd and Docker)'
          if hm_docker_restarted is changed else '' }}: {% for r in hm_stopped_why.results %}{{ r.item }}: {{
          r.stdout | default('') | trim or 'gone' }}{{ '; ' if not loop.last }}{% endfor %}.
          A container without a restart policy doesn't come back after a reboot: start it, or give it one.

    - name: Failed systemd units after patching
      ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain
      register: failed_after
      changed_when: false

    # Compared by unit name (the description may change); failed_units_ignore (group_vars) and, in LXC
    # guests, lxc_failed_units_ignore don't count (GitHub issue #51)
    - name: New failed units
      ansible.builtin.set_fact:
        hm_new_failed: >-
          {{ failed_after.stdout_lines | select | map('split') | map('first') | list
             | difference(failed_before.stdout_lines | select | map('split') | map('first') | list)
             | difference(failed_units_ignore | default([], true)
                          + (lxc_failed_units_ignore if ansible_facts.virtualization_type | default('') == 'lxc' else [])) }}

    - name: How the new failed units start
      ansible.builtin.command:
        argv: [systemctl, show, -p, Type, --value, "{{ item }}"]
      loop: "{{ hm_new_failed }}"
      register: hm_new_failed_type
      changed_when: false

    - name: No new failed units
      ansible.builtin.assert:
        that: hm_new_failed | length == 0
        fail_msg: >-
          New failed units: {{ hm_new_failed | join(', ') }}{{
          ('. Oneshot (may fail on every boot, e.g. after a long uptime reset its state): ' ~ oneshots | join(', ')
           ~ '. Check `journalctl -b -u <unit>`; if the update did not cause it, list it in failed_units_ignore'
           ~ ' (group_vars) and rerun the rest') if oneshots | length > 0 else '' }}
      vars:
        oneshots: >-
          {{ hm_new_failed_type.results | default([]) | selectattr('stdout', 'defined')
             | selectattr('stdout', 'eq', 'oneshot') | map(attribute='item') | list }}

    - name: Cluster post-hook (uncordon, leave maintenance, …)
      ansible.builtin.include_tasks:
        file: "{{ [playbook_dir, '..', post_hook] | path_join }}"  # absolute paths win
        apply:
          become: false
      when: post_hook is defined

    - name: Cluster health check (the roll stops here if the node isn't healthy)
      ansible.builtin.include_tasks:
        file: "{{ [playbook_dir, '..', health_check] | path_join }}"  # absolute paths win
      when: health_check is defined

    - name: Result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: updated={{ (upd_rh.changed | default(false)) or (upd_deb.changed | default(false)) }},
              reboot_pending={{ needs_reboot and not (rebooted.rebooted | default(false)) }}
              {{ ('(' ~ reboot_reasons | join('; ') ~ ')') if needs_reboot and not (rebooted.rebooted | default(false)) else '' }},
              restart_pending={{ restart_pending }}{{ (', autoremove skipped: ' ~ hm_autoremove_skip)
              if hm_autoremove_skip | default('') | length > 0 else '' }}{{ (', no snapshot: ' ~ hm_snapshot_skip)
              if snapshot | bool and hm_snapshot_skip | default('') | length > 0 else '' }}{{ ', containerd and docker restarted (containers were down)'
              if hm_docker_restarted is changed else '' }}{{ ', was stopped after its reboot and started through the Proxmox API'
              if rebooted.started_by_api | default(false) | bool else '' }}"
