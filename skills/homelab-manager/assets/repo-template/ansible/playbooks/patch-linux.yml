# Rolling Linux patching with health checks.
#
#   ansible-playbook playbooks/patch-linux.yml -e target=<group|host> [-e security_only=true]
#       [-e reboot=never|if_required|always] [-e restart_services=true]
#       [-e snapshot=true -e hm_scripts=$HM/scripts] [-e autoremove=false] [-e purge=true]
#       [-e pre_hook=… -e post_hook=… -e health_check=…] [-e order=vip_holder_last -e vip=<ip>]
#
# Safe defaults: one host at a time (serial 1), stop at the first failure, NO reboots.
# reboot: never (default), if_required (old name: allow_reboot=true) or always (e.g. an app cluster that
# should come back from a clean boot). A reboot is required for a newer kernel than the running one (also on
# plain Debian, which has no /var/run/reboot-required), needs-restarting -r or the reboot-required flag.
# Services still using replaced binaries or libraries are reported as restart_pending; restart_services=true
# restarts them (except restart_exclude) when the host is not rebooted anyway.
# snapshot=true: a disk-only Proxmox snapshot of each guest (pve_snapshot.py create, name snapshot_name,
# default prepatch-<date>) right before it is updated; the guest is the inventory short name or the host var
# proxmox_vmid. Needs hm_scripts (the skill's scripts directory). Remove the snapshots after a successful run
# with pve_snapshot.py delete (the user's yes): they keep growing.
# autoremove (default true): after the reboot (or when there is none) remove packages nothing needs any more
# (apt/dnf autoremove). Only then can the kernel that was running during the update go, so old kernels
# don't pile up. purge=true also removes the configuration left behind by removed Debian packages (`rc` in
# dpkg -l); off by default, those files may still be wanted.
#
# Clusters (`clusters:` in homelab.yaml): never in parallel, keep serial 1, pass the cluster's settings:
#   pre_hook / post_hook  task files run before/after each node, WITHOUT sudo (kubectl on this Mac: drain/uncordon)
#   health_check          task file run on each node after it is back (with sudo); it retries itself, and a
#                         failure stops the roll, e.g. playbooks/hooks/vrrp-health.yml (keepalived/VRRP)
#   order: vip_holder_last + vip   the node holding the VIP is patched last, so it fails over only once
# Task file paths are relative to ansible/ (as written in homelab.yaml).
# Packages listed in `patch_exclude` (set it in the group's group_vars, e.g. kubelet/kubeadm/kubectl
# for Kubernetes nodes) are never upgraded: dnf exclude on RHEL, apt hold on Debian.
# Not a play var on purpose — play vars would override group_vars.
# Hosts with patch_requires_approval: true (group_vars/proxmox_nodes.yml) are refused unless listed in
# -e patch_approved=<host,…>.
- name: Order the hosts (order=vip_holder_last puts the node holding the VIP last)
  hosts: "{{ target | default('__no_target__') }}"
  gather_facts: false
  become: false
  tasks:
    - name: Refuse to run without an explicit target
      ansible.builtin.assert:
        that: target is defined and target | length > 0
        fail_msg: "Pass -e target=<group or host>."
      run_once: true

    - name: order=vip_holder_last needs the VIP
      ansible.builtin.assert:
        that: vip is defined and vip | length > 0
        fail_msg: "Pass -e vip=<address> with order=vip_holder_last."
      run_once: true
      when: (order | default('')) == 'vip_holder_last'

    - name: Does this node hold the VIP?
      ansible.builtin.shell: ip -o addr show | grep -cF ' {{ vip }}/' || true
      register: hm_vip
      changed_when: false
      check_mode: false
      when: (order | default('')) == 'vip_holder_last'

    - name: Patch order
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: hm_patch_order
      loop: "{{ (ansible_play_hosts_all | reject('in', holders) | list) + holders }}"  # keeps inventory order
      vars:
        holders: >-
          {{ ansible_play_hosts_all | map('extract', hostvars)
             | selectattr('hm_vip.stdout', 'defined') | selectattr('hm_vip.stdout', 'ne', '0')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      changed_when: false

- name: Patch Linux hosts
  hosts: hm_patch_order
  serial: "{{ patch_serial | default(1) }}"
  max_fail_percentage: 0
  any_errors_fatal: true
  become: true
  vars:
    security_only: false
    allow_reboot: false
    reboot: "{{ 'if_required' if allow_reboot | bool else 'never' }}"
    restart_services: false
    snapshot: false
    autoremove: true
    purge: false
    snapshot_name: "prepatch-{{ now().strftime('%Y%m%d') }}"
    # never restarted automatically (a reboot or the user's own step instead): restarting these drops sessions
    restart_exclude: [dbus.service, dbus-broker.service, systemd-logind.service]

  pre_tasks:
    - name: reboot is never, if_required or always
      ansible.builtin.assert:
        that: reboot in ['never', 'if_required', 'always']
        fail_msg: "reboot={{ reboot }}: use never, if_required or always."
      run_once: true

    - name: snapshot=true needs the skill's scripts
      ansible.builtin.assert:
        that: hm_scripts is defined
        fail_msg: "Pass -e hm_scripts=<skill dir>/scripts with snapshot=true (pve_snapshot.py)."
      run_once: true
      when: snapshot | bool

    - name: Refuse hosts that need their own procedure (patch_requires_approval, e.g. Proxmox nodes)
      ansible.builtin.assert:
        that: guarded | length == 0
        fail_msg: >-
          {{ guarded | join(', ') }} must not be patched by a broad run (Proxmox nodes: patch-proxmox-node.yml).
          Only with the user's yes for exactly these hosts: -e patch_approved={{ guarded | join(',') }}
      vars:
        guarded: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_requires_approval', 'defined')
                     | selectattr('patch_requires_approval') | map(attribute='inventory_hostname')
                     | difference((patch_approved | default('')).split(',')) | list }}"
      run_once: true

    - name: Failed systemd units before patching
      ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain
      register: failed_before
      changed_when: false

    - name: Pre-patch snapshot (snapshot=true)
      ansible.builtin.command:
        argv: [python3, "{{ hm_scripts }}/pve_snapshot.py", create, "{{ proxmox_vmid | default(inventory_hostname_short) }}",
               --name, "{{ snapshot_name }}"]
        chdir: "{{ playbook_dir }}/../.."
      delegate_to: localhost
      become: false
      changed_when: "'done' in snap.stdout"
      register: snap
      when: snapshot | bool
      check_mode: false

    - name: Cluster pre-hook (drain, maintenance mode, …)
      ansible.builtin.include_tasks:
        file: "{{ [playbook_dir, '..', pre_hook] | path_join }}"  # absolute paths win
        apply:
          become: false
      when: pre_hook is defined

  tasks:
    - name: Installed packages (hold only what exists)
      ansible.builtin.package_facts:
      when: patch_exclude | default([]) | length > 0 and ansible_facts.os_family == "Debian"

    - name: Hold excluded packages (Debian family)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ patch_exclude | default([]) | select('in', ansible_facts.packages | default({})) | list }}"
      when: ansible_facts.os_family == "Debian"

    - name: Update (RHEL family)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: "{{ security_only | bool }}"
        update_only: true
        exclude: "{{ patch_exclude | default([]) }}"
      when: ansible_facts.os_family == "RedHat"
      register: upd_rh

    - name: Update (Debian family)
      ansible.builtin.apt:
        upgrade: "{{ 'yes' if security_only | bool else 'dist' }}"
        update_cache: true
      environment:
        NEEDRESTART_MODE: a
      when: ansible_facts.os_family == "Debian"
      register: upd_deb

    - name: Reboot required, services still running replaced code
      ansible.builtin.include_tasks: tasks/restart-check.yml

    - name: Reboot (reboot=always, or if_required and needed)
      ansible.builtin.reboot:
        reboot_timeout: 900
        msg: "Reboot by homelab-manager patching"
      when: reboot == 'always' or (reboot == 'if_required' and needs_reboot | bool)
      register: rebooted

    - name: Restart services still running replaced code (only with restart_services=true)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ restart_pending | difference(restart_exclude) }}"
      when: restart_services | bool and not (rebooted.rebooted | default(false))

    - name: Services left to restart
      ansible.builtin.set_fact:
        restart_pending: >-
          {{ [] if (rebooted.rebooted | default(false))
             else (restart_pending | intersect(restart_exclude) if restart_services | bool else restart_pending) }}

    # After the reboot: the kernel that was running during the update is no longer protected (GitHub issue #46)
    - name: Remove packages nothing needs any more (Debian family)
      ansible.builtin.apt:
        autoremove: true
        purge: "{{ purge | bool }}"
      when: autoremove | bool and ansible_facts.os_family == "Debian"

    - name: Remove packages nothing needs any more (RHEL family)
      ansible.builtin.dnf:
        autoremove: true
      when: autoremove | bool and ansible_facts.os_family == "RedHat"

    - name: Configuration left by removed packages (purge=true)
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${db:Status-Abbrev}\t${Package}\n"]
      register: hm_dpkg_status
      changed_when: false
      when: purge | bool and ansible_facts.os_family == "Debian"

    - name: Purge it (purge=true)
      ansible.builtin.command:
        argv: "{{ ['dpkg', '--purge'] + leftovers }}"
      vars:
        leftovers: "{{ hm_dpkg_status.stdout_lines | select('match', '^rc') | map('split', '\t') | map('last') | list }}"
      when: purge | bool and ansible_facts.os_family == "Debian" and leftovers | length > 0

  post_tasks:
    - name: Required services are active
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: svc
      failed_when: svc.status.ActiveState != "active"
      loop: "{{ health_services | default([]) }}"

    - name: Failed systemd units after patching
      ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain
      register: failed_after
      changed_when: false

    - name: No new failed units
      ansible.builtin.assert:
        that: (failed_after.stdout_lines | difference(failed_before.stdout_lines)) | length == 0
        fail_msg: "New failed units: {{ failed_after.stdout_lines | difference(failed_before.stdout_lines) }}"

    - name: Cluster post-hook (uncordon, leave maintenance, …)
      ansible.builtin.include_tasks:
        file: "{{ [playbook_dir, '..', post_hook] | path_join }}"  # absolute paths win
        apply:
          become: false
      when: post_hook is defined

    - name: Cluster health check (the roll stops here if the node isn't healthy)
      ansible.builtin.include_tasks:
        file: "{{ [playbook_dir, '..', health_check] | path_join }}"  # absolute paths win
      when: health_check is defined

    - name: Result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: updated={{ (upd_rh.changed | default(false)) or (upd_deb.changed | default(false)) }},
              reboot_pending={{ needs_reboot and not (rebooted.rebooted | default(false)) }}
              {{ ('(' ~ reboot_reasons | join('; ') ~ ')') if needs_reboot and not (rebooted.rebooted | default(false)) else '' }},
              restart_pending={{ restart_pending }}"
