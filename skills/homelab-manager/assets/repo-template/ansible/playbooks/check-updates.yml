# Read-only: which systems have pending (security) updates, need a reboot (with the reason), or run services
# that still use replaced binaries or libraries (restart_pending; patch-linux.yml -e restart_services=true).
# Writes discovery/updates.json, merged: hosts not checked this run keep their last result
# (each host has its own collected_at). A host that fails or can't be reached gets an entry with `error`
# (and `last_ok_at`, when its last good result was), so a gap is visible instead of silently missing.
# Safe to run any time. A subset: -e target=<group|host> (or -l <host>: the result is still written).
# autoremove_packages lists what patch-linux.yml's autoremove would remove; autoremove_protected the ones
# matching autoremove_protect (patch-linux.yml skips autoremove on such a host: review them first).
# Windows hosts (-e windows_target=…): a search only. QNAP NAS (-e qnap_target=…): firmware and app versions.
# With -e target=X every play keeps to X (GitHub issue #92): the Linux play skips windows/appliances/qnap hosts in X,
# the Windows and QNAP plays run only on X's windows/qnap hosts unless windows_target/qnap_target are given.
- name: Pending updates on Linux
  hosts: "{{ target | default('linux') }}:!windows:!appliances:!qnap"
  gather_facts: false
  become: true
  vars:
    # the same list as in patch-linux.yml; override with autoremove_protect in group_vars (GitHub issue #58)
    hm_autoremove_protect: [sssd*, libsss*, libnss-*, libpam-*, nss-*, pam*, freeipa-*, ipa-*, krb5-*, libkrb5*,
                            realmd, adcli, winbind*, oddjob*, openssh-*, ssh, sudo*, polkit*, systemd*, dbus*,
                            network*, netplan*, ifupdown*, NetworkManager*, dhcp*, isc-dhcp-*, resolvconf,
                            cloud-init, python3, python3-apt, python3-dnf*, chrony*, ntp*]
  tasks:
    - name: Mark as checked (runs locally, also for hosts that turn out unreachable)
      ansible.builtin.set_fact:
        hm_checked: true

    - name: Facts
      ansible.builtin.setup:
      ignore_unreachable: true
      ignore_errors: true
      register: hm_reach

    - name: Unreachable, or no facts (e.g. sudo)
      ansible.builtin.set_fact:
        update_error: >-
          {{ 'unreachable' if hm_reach.unreachable | default(false) else 'facts' }}: {{
             hm_reach.msg | default('failed') | trim | truncate(200) }}
      when: hm_reach.unreachable | default(false) or hm_reach is failed

    - name: Check
      when: update_error is not defined
      block:
        # Packages dnf would update for security advisories: like check-update, it honours enabled module
        # streams (updateinfo list would also count advisories for streams that aren't enabled, one line per
        # package and advisory, so it could exceed `pending`).
        - name: RHEL family — security updates
          ansible.builtin.command: dnf -q check-update --security
          register: rh_sec
          changed_when: false
          failed_when: rh_sec.rc not in [0, 100]
          when: ansible_facts.os_family == "RedHat"

        - name: RHEL family — all updates
          ansible.builtin.command: dnf -q check-update
          register: rh_all
          changed_when: false
          failed_when: rh_all.rc not in [0, 100]
          when: ansible_facts.os_family == "RedHat"

        # apt-get, not the apt module: that one installs python3-apt first, which fails on archived releases
        - name: Debian family — refresh package lists
          ansible.builtin.command: apt-get -q update
          changed_when: false
          when: ansible_facts.os_family == "Debian"

        - name: Debian family — simulate upgrade
          ansible.builtin.command: apt-get -s -o Debug::NoLocking=1 dist-upgrade
          register: deb_sim
          changed_when: false
          when: ansible_facts.os_family == "Debian"

        - name: Debian family — packages autoremove would remove
          ansible.builtin.shell: >-
            set -o pipefail; apt-get -s -o Debug::NoLocking=1 autoremove | awk '/^Remv /{sub(/:.*/, "", $2); print $2}'
          args:
            executable: /bin/bash
          register: deb_autoremove
          changed_when: false
          when: ansible_facts.os_family == "Debian"

        - name: Debian family — configuration left by removed packages
          ansible.builtin.shell: dpkg-query -W -f='${db:Status-Abbrev}\n' | grep -c '^rc' || true
          register: deb_left
          changed_when: false
          when: ansible_facts.os_family == "Debian"

        - name: RHEL family — packages autoremove would remove
          ansible.builtin.command: dnf -q repoquery --unneeded
          register: rh_left
          changed_when: false
          failed_when: false
          when: ansible_facts.os_family == "RedHat"

        - name: Free space on /, /var and /boot (MB)
          ansible.builtin.shell: |
            for d in / /var /boot; do [ -d "$d" ] && df -Pm "$d" | tail -n +2; done; true
          register: hm_df
          changed_when: false

        - name: Reboot required, services still running replaced code
          ansible.builtin.include_tasks: tasks/restart-check.yml

        - name: Summarise
          ansible.builtin.set_fact:
            update_summary:
              os: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
              kernel: "{{ ansible_facts.kernel }}"
              pending: >-
                {{ (rh_all.stdout_lines | default([]) | select('match', '^\S+\.\S+\s') | list | length)
                   if ansible_facts.os_family == 'RedHat'
                   else (deb_sim.stdout_lines | default([]) | select('match', '^Inst ') | list | length) }}
              security: >-
                {{ (rh_sec.stdout_lines | default([]) | select('match', '^\S+\.\S+\s') | list | length)
                   if ansible_facts.os_family == 'RedHat'
                   else (deb_sim.stdout_lines | default([]) | select('match', '^Inst .*[Ss]ecurity') | list | length) }}
              reboot_required: "{{ needs_reboot }}"
              reboot_reasons: "{{ reboot_reasons }}"
              restart_pending: "{{ restart_pending }}"
              # left over after patching (old kernels and dependencies); patch-linux.yml autoremoves them
              autoremovable: "{{ hm_removable | length }}"
              autoremove_packages: "{{ hm_removable }}"
              autoremove_protected: "{{ hm_protected }}"
              config_leftovers: "{{ (deb_left.stdout | default(0) | int) if ansible_facts.os_family == 'Debian' else 0 }}"
              # MB free per mount point; low_space: below what patch-linux.yml needs (it refuses to start)
              free_mb: "{{ hm_free }}"
              root_free_mb: "{{ hm_free['/'] | default(none) }}"
              low_space: >-
                {%- set out = [] -%}
                {%- for mnt, mb in hm_free.items() -%}
                  {%- set need = (patch_min_free_boot_mb | default(100)) if mnt == '/boot'
                                 else (patch_min_free_mb | default(500)) -%}
                  {%- if mb < need | int -%}{%- set _ = out.append(mnt) -%}{%- endif -%}
                {%- endfor -%}
                {{ out }}
          vars:
            hm_free: >-
              {%- set out = {} -%}
              {%- for line in hm_df.stdout_lines | default([]) if line.split() | length >= 6 -%}
                {%- set _ = out.update({line.split()[5]: line.split()[3] | int}) -%}
              {%- endfor -%}
              {{ out }}
            hm_removable: >-
              {{ ((deb_autoremove.stdout_lines | default([]))
                  + (rh_left.stdout_lines | default([]) | map('regex_replace', '^(.+)-(\d+:)?[^-]+-[^-]+$', '\1')))
                 | map('trim') | select | unique | list }}
            hm_protected: >-
              {%- set out = [] -%}
              {%- for pkg in hm_removable -%}
                {%- for pat in autoremove_protect | default(hm_autoremove_protect, true)
                    if pkg is match('^' ~ (pat | regex_escape | replace('\*', '.*') | replace('\?', '.')) ~ '$') -%}
                  {%- set _ = out.append(pkg) -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ out | unique | list }}

      rescue:
        - name: Record the failure
          ansible.builtin.set_fact:
            update_error: >-
              {{ ansible_failed_task.name }}: {{ (ansible_failed_result.stderr | default('', true)
              or ansible_failed_result.msg | default('failed')) | trim | truncate(200) }}

- name: Pending updates on Windows (search only, installs nothing)
  hosts: "{{ windows_target | default((target ~ ':&windows') if target is defined else 'windows') }}"
  gather_facts: false
  tasks:
    - name: Mark as checked
      ansible.builtin.set_fact:
        hm_checked: true
    - name: Search
      ansible.windows.win_updates:
        state: searched
        category_names: [SecurityUpdates, CriticalUpdates, UpdateRollups]
      register: win_upd
      ignore_unreachable: true
      ignore_errors: true
    - name: Record a failure
      ansible.builtin.set_fact:
        update_error: >-
          {{ 'unreachable: ' if win_upd.unreachable | default(false) else 'Search: ' }}{{
             win_upd.msg | default('failed') | trim | truncate(200) }}
      when: win_upd.unreachable | default(false) or win_upd.failed | default(false)
    - ansible.builtin.set_fact:
        update_summary:
          os: windows
          pending: "{{ win_upd.found_update_count | default(0) }}"
          security: "{{ win_upd.updates | default({}) | dict2items | selectattr('value.categories', 'contains', 'Security Updates') | list | length }}"
          reboot_required: "{{ win_upd.reboot_required | default(false) }}"
      when: update_error is not defined

# QNAP NAS (group qnap, raw only, GitHub issue #81): the firmware installed and when QTS last checked for a new
# one (QTS fetches the available firmware version itself; nothing here asks QNAP's servers), and installed apps
# (QPKG) with a newer version in App Center's catalogue as QTS last cached it (/tmp/rssdoc, refreshed by QTS;
# gone after a reboot until App Center refreshes it). Installs nothing: updates stay in the QTS UI.
- name: Firmware and app versions on QNAP NAS (reads files only)
  hosts: "{{ qnap_target | default((target ~ ':&qnap') if target is defined else 'qnap') }}"
  gather_facts: false
  tasks:
    - name: Mark as checked
      ansible.builtin.set_fact:
        hm_checked: true

    - name: Versions
      ansible.builtin.raw: |
        PATH=/sbin:/usr/sbin:/bin:/usr/bin:/usr/local/bin:$PATH; export PATH
        U=/etc/config/uLinux.conf; X=/tmp/rssdoc/qpkgcenter_eng.xml
        echo HM-BEGIN
        echo "fw|$(getcfg System Version -f $U)|$(getcfg System 'Build Number' -f $U)|$(getcfg System Model -f $U)|$(getcfg System 'Latest Check Live Update' -f $U)"
        if command -v zpool >/dev/null 2>&1; then echo "product|QuTS hero"; else echo "product|QTS"; fi
        P=$(head -n 1 /etc/config/BOOT.conf 2>/dev/null | tr -d ' \r'); echo "platform|$P"
        if [ -r "$X" ]; then echo "catalogue|$(sed -n 's:.*<cachechk>\([^<]*\)</cachechk>.*:\1:p' "$X" | head -n 1)"; else echo "catalogue|"; fi
        awk '/^\[/{s=substr($0, 2, length($0) - 2)} /^Version = /{v[s]=$3} /^Enable = /{e[s]=$3}
             END{for (n in v) print "app|" n "|" v[n] "|" e[n]}' /etc/config/qpkg.conf
        [ -r "$X" ] && awk -v p="$P" '/<item>/{n=""; v=""; ok=0} /<internalName>/{gsub(/.*<internalName>|<\/internalName>.*/, ""); n=$0}
             /<version>/{gsub(/.*<version>|<\/version>.*/, ""); v=$0} /<platformID>/{if (index($0, ">" p "<")) ok=1}
             /<\/item>/{if (ok && n != "" && v != "") print "avail|" n "|" v}' "$X"
        echo HM-END
      register: hm_qnap
      changed_when: false
      check_mode: false
      ignore_unreachable: true
      ignore_errors: true

    - name: Record a failure
      ansible.builtin.set_fact:
        update_error: >-
          {{ 'unreachable: ' if hm_qnap.unreachable | default(false) else 'Versions: ' }}{{
             (hm_qnap.stderr | default('', true) or hm_qnap.msg | default('failed')).splitlines() | join(' ')
             | trim | truncate(200) }}
      when: hm_qnap.unreachable | default(false) or hm_qnap is failed

    - name: Summarise
      ansible.builtin.set_fact:
        update_summary:
          os: "{{ (hm_q.product | default(['QTS']))[0] }} {{ fw[0] | default('?') }}"
          firmware:
            version: "{{ fw[0] | default(none) }}"
            build: "{{ fw[1] | default(none) }}"
            model: "{{ fw[2] | default(none) }}"
            last_check: "{{ fw[3] | default(none, true) }}"
          # pending: apps with a newer version in the catalogue; firmware updates are only shown in the QTS UI
          pending: "{{ hm_apps | selectattr('available') | list | length }}"
          security: null
          reboot_required: null
          apps: "{{ hm_apps }}"
          app_catalogue: "{{ (hm_q.catalogue | default(['']))[0] or none }}"
      vars:
        lines: >-
          {%- set ns = namespace(on=false, out=[]) -%}
          {%- for l in hm_qnap.stdout.splitlines() | map('trim') -%}
            {%- if l == 'HM-END' -%}{%- set ns.on = false -%}
            {%- elif ns.on and l -%}{%- set ns.out = ns.out + [l] -%}
            {%- elif l == 'HM-BEGIN' -%}{%- set ns.on = true -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.out }}
        hm_q: >-
          {%- set out = {} -%}
          {%- for l in lines if l.split('|')[0] in ['fw', 'product', 'platform', 'catalogue'] -%}
            {%- set _ = out.update({l.split('|')[0]: l.split('|')[1:]}) -%}
          {%- endfor -%}
          {{ out }}
        fw: "{{ hm_q.fw | default([]) }}"
        hm_apps: >-
          {%- set avail = {} -%}
          {%- for l in lines if l.startswith('avail|') -%}
            {%- set f = l.split('|') -%}
            {%- set _ = avail.update({f[1]: avail.get(f[1], []) + [f[2]]}) -%}
          {%- endfor -%}
          {%- set out = [] -%}
          {%- for l in lines if l.startswith('app|') -%}
            {%- set f = l.split('|') -%}
            {%- set newer = avail.get(f[1], []) | select('version', f[2], '>', version_type='loose') | list -%}
            {%- set ns = namespace(top=none) -%}
            {%- for v in newer if ns.top is none or v is version(ns.top, '>', version_type='loose') -%}
              {%- set ns.top = v -%}
            {%- endfor -%}
            {%- set _ = out.append({'name': f[1], 'installed': f[2], 'enabled': f[3] | default('') == 'TRUE',
                                    'in_catalogue': f[1] in avail, 'available': ns.top}) -%}
          {%- endfor -%}
          {{ out | sort(attribute='name') }}
      when: update_error is not defined

# Runs on the checked hosts, writing once on this Mac: a `hosts: localhost` play would be skipped by
# --limit (-l <host>), losing the result (GitHub issue #48).
- name: Write discovery/updates.json
  hosts: "{{ target | default('linux:windows:qnap') }}{{ (':' ~ windows_target) if windows_target is defined else '' }}{{ (':' ~ qnap_target) if qnap_target is defined else '' }}"
  gather_facts: false
  become: false
  vars:
    updates_file: "{{ playbook_dir }}/../../discovery/updates.json"
    checked: "{{ groups['all'] | map('extract', hostvars) | selectattr('hm_checked', 'defined') | list }}"
    reported: "{{ checked | selectattr('update_summary', 'defined') | rejectattr('update_error', 'defined') | map(attribute='inventory_hostname') | list }}"
    failed: "{{ checked | map(attribute='inventory_hostname') | reject('in', reported) | list }}"
  tasks:
    # one write for all hosts, on this Mac (the file is local)
    - name: Read the previous results
      run_once: true
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ updates_file }}"
      register: prev_updates

    # Merge: hosts checked now replace their entry, others keep theirs (each with its own collected_at),
    # so `-e target=<group>` doesn't drop the rest. Hosts gone from the inventory are dropped; entries
    # from older files get the file's collected_at.
    - name: Merge with this run
      run_once: true
      delegate_to: localhost
      ansible.builtin.set_fact:
        updates_merged: >-
          {%- set prev = (lookup('ansible.builtin.file', updates_file) | from_json) if prev_updates.stat.exists else {} -%}
          {%- set hosts = {} -%}
          {%- for name, entry in (prev.hosts | default({})).items() if name in groups['all'] -%}
            {%- set _ = hosts.update({name: {'collected_at': prev.collected_at | default(none)} | combine(entry)}) -%}
          {%- endfor -%}
          {%- for name in reported -%}
            {%- set _ = hosts.update({name: hostvars[name].update_summary | combine({'collected_at': now_utc})}) -%}
          {%- endfor -%}
          {%- for name in failed -%}
            {%- set old = hosts.get(name, {}) -%}
            {%- set _ = hosts.update({name: {'error': hostvars[name].update_error | default('failed (see the play output)'),
                                             'collected_at': now_utc,
                                             'last_ok_at': old.last_ok_at | default(none) if 'error' in old
                                                           else old.collected_at | default(none)}}) -%}
          {%- endfor -%}
          {%- for name in hosts | list -%}   {# each host's site: its site_<name> group (GitHub #75) #}
            {%- set _ = hosts.update({name: hosts[name] | combine({'site': hostvars[name].group_names | select('match', '^site_')
                                            | map('regex_replace', '^site_', '') | first | default(none)})}) -%}
          {%- endfor -%}
          {{ {'collected_at': now_utc, 'hosts': hosts} }}
      vars:
        now_utc: "{{ now(utc=true).isoformat() }}"

    - name: Write
      run_once: true
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ updates_file }}"
        content: "{{ updates_merged | to_nice_json }}\n"
        mode: "0644"

    - name: Hosts without a result
      run_once: true
      delegate_to: localhost
      ansible.builtin.debug:
        msg: "{% for h in failed %}{{ h }}: {{ hostvars[h].update_error | default('failed') }}{{ '; ' if not loop.last }}{% endfor %}"
      when: failed | length > 0
