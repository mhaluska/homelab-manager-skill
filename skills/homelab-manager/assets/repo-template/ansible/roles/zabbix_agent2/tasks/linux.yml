# Linux: read what is there, work out the settings, install from the official repo, write the drop-in, start (or
# switch from the classic agent) and check. Everything up to the install only reads, also in check mode.
- name: Supported system and settings
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in ['RedHat', 'Debian']
      - ansible_facts.os_family != 'RedHat' or ansible_facts.distribution_major_version | int in [8, 9, 10]
      - zabbix_agent_version is match('^\d+\.\d+$')
    fail_msg: >-
      {{ inventory_hostname }}: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      {{- ' is not supported (RHEL family 8-10, Debian, Ubuntu)' if ansible_facts.os_family not in ['RedHat', 'Debian']
          or (ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version | int not in [8, 9, 10])
          else '' }}{{ ('; no Zabbix version: set zabbix.agent.version (e.g. 8.0) or run zabbix_api.py discover'
                        ' (got ' ~ (zabbix_agent_version or 'nothing') ~ ')') if zabbix_agent_version is not match('^\d+\.\d+$')
                       else '' }}.

# --- read the current state (read-only, also in check mode)

- name: Agent configuration files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: ["{{ zbx_main_conf }}", "{{ zbx_dropin }}", "{{ zbx_classic_conf }}"]
  register: zbx_stat

- name: Read them
  ansible.builtin.slurp:
    src: "{{ item.item }}"
  loop: "{{ zbx_stat.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: zbx_read

- name: Files the agents include
  ansible.builtin.find:
    paths: [/etc/zabbix/zabbix_agentd.d, "{{ zbx_dropin_dir }}"]
    patterns: ["*.conf"]
    excludes: [homelab-manager.conf, homelab-manager-userparameters.conf]
  register: zbx_includes

- name: Read the included files
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ zbx_includes.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: zbx_inc_read

- name: Services
  ansible.builtin.service_facts:

- name: ufw state
  ansible.builtin.command: ufw status
  register: zbx_ufw
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'ufw.service' in ansible_facts.services"

- name: Agent packages (installed, or removed with their config left)
  ansible.builtin.shell: >-
    {% if ansible_facts.os_family == 'Debian' %}dpkg-query -W -f='${Package} ${db:Status-Abbrev}\n'
    zabbix-agent zabbix-agent2 2>/dev/null || true{% else %}rpm -q --qf '%{NAME} ii\n' zabbix-agent zabbix-agent2
    | grep -v 'not installed' || true{% endif %}
  register: zbx_pkg_state
  changed_when: false
  check_mode: false

# --- work out the settings (tasks/settings.yml only reads what was gathered above)

- name: The settings for this host
  ansible.builtin.include_tasks: settings.yml

# --- install

- name: Repository
  ansible.builtin.include_tasks:
    file: "repo-{{ 'redhat' if ansible_facts.os_family == 'RedHat' else 'debian' }}.yml"

- name: Zabbix Agent 2
  ansible.builtin.package:
    name: zabbix-agent2
    state: "{{ 'latest' if zabbix_agent_upgrade | bool else 'present' }}"
    update_cache: "{{ true if (zbx_repo.changed | default(false) | bool) and ansible_facts.os_family == 'Debian' else omit }}"
  register: zbx_pkg
  # check mode adds no repository, so a host without Agent 2 can't resolve the package: the next step says what
  # would be installed
  when: not (ansible_check_mode and not zbx_installed.main | bool)

- name: Installed?
  ansible.builtin.stat:
    path: "{{ zbx_main_conf }}"
  register: zbx_main

# In check mode on a host without the agent nothing more can be shown: the files come with the package.
- name: Not installed yet (check mode)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: would install zabbix-agent2 {{ zabbix_agent_version }} and configure Hostname={{
      zbx_hostname }}, Server={{ zbx_server }}, ServerActive={{ zbx_server_active }}{{ '; the classic agent keeps running (-e zabbix_agent_migrate=true switches)'
      if zbx_classic_running and not zabbix_agent_migrate | bool else '' }}.
  when: not zbx_main.stat.exists

- name: Configure, start and check
  when: zbx_main.stat.exists
  block:
    - name: Agent 2 runs after this play
      ansible.builtin.set_fact:
        zbx_agent2_runs: "{{ not zbx_classic_running or zabbix_agent_migrate | bool }}"

    - name: Drop-in with the homelab settings
      ansible.builtin.template:
        src: homelab-manager.conf.j2
        dest: "{{ zbx_dropin }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart zabbix-agent2

    - name: UserParameters of the classic agent
      ansible.builtin.copy:
        dest: "{{ zbx_dropin_userparams }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (homelab-manager zabbix_agent2 role): UserParameters carried over from the classic agent
          {{ zbx_userparams | join('\n') }}
      when: zbx_userparams | length > 0
      notify: Restart zabbix-agent2

    - name: PSK
      ansible.builtin.copy:
        dest: "{{ zabbix_agent_psk_file }}"
        content: "{{ lookup('ansible.builtin.env', zbx_psk_env) }}\n"
        owner: zabbix
        group: zabbix
        mode: "0640"
      no_log: true
      when: zabbix_agent_psk_secret | length > 0
      notify: Restart zabbix-agent2

    # A setting defined twice stops the agent: the package's file keeps its other settings, these move to the drop-in.
    - name: Settings of the drop-in out of the main file
      ansible.builtin.replace:
        path: "{{ zbx_main_conf }}"
        regexp: '^(({{ zbx_settings.keys() | join("|") }})\s*=.*)$'
        replace: '# \1   (set in zabbix_agent2.d/homelab-manager.conf)'
      notify: Restart zabbix-agent2

    - name: The main file reads the drop-ins
      ansible.builtin.lineinfile:
        path: "{{ zbx_main_conf }}"
        regexp: '^Include\s*=\s*{{ zbx_dropin_dir | regex_escape }}/\*\.conf\s*$'
        line: "Include={{ zbx_dropin_dir }}/*.conf"
      notify: Restart zabbix-agent2

    - name: The configuration is valid
      ansible.builtin.command: zabbix_agent2 -c {{ zbx_main_conf }} -T
      register: zbx_test
      changed_when: false
      failed_when: zbx_test.rc != 0
      when: not ansible_check_mode

    - name: Firewall (firewalld)
      ansible.posix.firewalld:
        port: "{{ zabbix_agent_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      when:
        - zabbix_agent_firewall | bool
        - zabbix_agent_mode != 'active'   # nothing listens
        - (ansible_facts.services['firewalld.service'] | default({})).state | default('') == 'running'

    - name: Firewall (ufw)
      community.general.ufw:
        rule: allow
        port: "{{ zabbix_agent_port | string }}"
        proto: tcp
        comment: zabbix-agent2
      when:
        - zabbix_agent_firewall | bool
        - zabbix_agent_mode != 'active'   # nothing listens
        - zbx_ufw.stdout | default('') is search('Status:\s+active')

    - name: Agent 2 waits while the classic agent runs
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        enabled: false
        state: stopped
      when: not zbx_agent2_runs | bool

    - name: Agent 2 runs
      ansible.builtin.systemd_service:
        name: zabbix-agent2
        enabled: true
        state: started
      when: zbx_agent2_runs | bool and not zbx_classic_running

    - name: Switch from the classic agent
      when: zbx_agent2_runs | bool and zbx_classic_running and not ansible_check_mode
      block:
        - name: Stop the classic agent (both use the port)
          ansible.builtin.systemd_service:
            name: zabbix-agent
            state: stopped

        - name: Start Agent 2
          ansible.builtin.systemd_service:
            name: zabbix-agent2
            enabled: true
            state: restarted

        - name: Agent 2 answers
          ansible.builtin.include_tasks: health.yml

        - name: Classic agent off for good
          ansible.builtin.systemd_service:
            name: zabbix-agent
            enabled: false
      rescue:
        - name: Back to the classic agent
          ansible.builtin.systemd_service:
            name: zabbix-agent2
            state: stopped
          failed_when: false

        - name: Classic agent again
          ansible.builtin.systemd_service:
            name: zabbix-agent
            state: started

        - name: Switch failed
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: Agent 2 did not come up ({{ ansible_failed_result.msg | default('see above') }});
              the classic agent runs again. Check `journalctl -u zabbix-agent2` and {{ zbx_dropin }}.

    - name: Apply changed settings
      ansible.builtin.meta: flush_handlers

    - name: Agent 2 answers
      ansible.builtin.include_tasks: health.yml
      when: zbx_agent2_runs | bool and not zbx_classic_running and not ansible_check_mode

- name: Result
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: zabbix-agent2 {{ zabbix_agent_version }} line, Hostname={{ zbx_hostname }},
      Server={{ zbx_server or '(none: active checks only)' }}, ServerActive={{ zbx_server_active or '(none: passive
      checks only)' }}, HostMetadata={{ zbx_metadata or '(none)' }}{{ ', PSK' if zabbix_agent_psk_secret else '' }}
      {{- (' (was ' ~ zbx_metadata_have ~ ': autoregistration runs again for this host)')
          if zbx_metadata != zbx_metadata_have and zbx_metadata_have else '' }}
      {{- ('; no autoregistration action of the server matches this HostMetadata (discovery/zabbix.json): the host '
           'would get no groups or templates from it') if zbx_metadata_unmatched | bool else '' }}
      {{- ('; settings not read from ' ~ zbx_leftover | join(', ') ~ ' (its agent is not installed: a leftover file)')
          if zbx_leftover else '' }}
      {{- (', ' ~ zbx_userparams | length ~ ' UserParameters carried over') if zbx_userparams else '' }}
      {{- ('; classic agent still runs: -e zabbix_agent_migrate=true switches to Agent 2')
          if zbx_classic_running and not zabbix_agent_migrate | bool else '' }}
      {{- ('; not carried over from the classic agent (decide, then set zabbix_agent_extra): '
           ~ zbx_not_copied | join(', ')) if zbx_not_copied else '' }}.
