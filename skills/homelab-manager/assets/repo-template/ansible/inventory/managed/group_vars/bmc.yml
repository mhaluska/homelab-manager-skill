# BMCs (HPE iLO, Dell iDRAC, Supermicro, Lenovo XCC …): read over Redfish/HTTPS from this Mac, never configured
# by Ansible. Put each BMC in the `bmc` group (a child of appliances) with ansible_host = its address.
# Credentials come from the keychain through with_secrets.py (secrets.bmc, kind user_password, env BMC):
#   python3 $HM/scripts/with_secrets.py bmc -- ansible-playbook playbooks/bmc-info.yml
# Use a read-only BMC account (iLO "Login" privilege only, iDRAC "Read Only", Supermicro "User").
ansible_connection: local
ansible_python_interpreter: "{{ ansible_playbook_python }}"
# A BMC with its own account: a secret of its own (kind user_password, env e.g. BMC_ILO) and, in its host vars,
# bmc_secret_env: BMC_ILO; then run with both secrets (`with_secrets.py bmc bmc-ilo -- …`).
bmc_secret_env: BMC
bmc_user: "{{ lookup('ansible.builtin.env', bmc_secret_env ~ '_USER') }}"
bmc_password: "{{ lookup('ansible.builtin.env', bmc_secret_env ~ '_PASSWORD') }}"
bmc_validate_certs: false   # BMCs mostly use self-signed certificates; true once their CA is trusted
# A known, harmless reason for a health that is not OK (e.g. a tripped chassis intrusion sensor that needs a manual
# re-arm) is accepted per host, by the cause names bmc-info.yml records in health_causes (an entry also matches as
# a part of a cause, case-insensitive): bmc_health_accept: [chassis_intrusion]. OVERVIEW.md then shows the health as
# accepted and counts no warning; any other cause still warns. Only on the user's request.
