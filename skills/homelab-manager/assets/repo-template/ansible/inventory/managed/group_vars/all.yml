# No secrets here. SSH uses the agent of the management Mac.
ansible_user: "{{ homelab_admin_user | default(omit) }}"
health_services: []        # services that must be active after changes, e.g. [sshd, zabbix-agent2]
failed_units_ignore: []    # failed units patch-linux.yml must not count as new, e.g. ones that fail on every boot
