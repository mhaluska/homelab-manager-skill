# homelab.yaml — single source of site configuration for the homelab-manager skill.
# No secrets here: only *names* of keychain items. This file is committed to Git.
# Empty values are unknown: the skill discovers them (Proxmox API) or asks you.
version: 1

# Which parts of the homelab this repo manages. Set by init_repo.py during setup;
# the skill ignores disabled parts and won't create files for them. Enable one later
# by asking Claude (e.g. "I want to start using Packer templates").
components:
  proxmox: true       # Proxmox VE VMs/LXC via OpenTofu
  templates: true     # Packer VM templates (needs proxmox)
  ansible: true       # configuration management + patching
  discovery: true     # nmap discovery in authorized ranges
  windows: false
  appliances: false
  kubernetes: false
  monitoring: false   # Zabbix: hosts, templates, maintenance as data (needs ansible)

site:
  name: homelab
  domain: ""                 # e.g. home.arpa
  timezone: ""               # e.g. Europe/Bratislava
  language: ""               # e.g. sk — Claude's replies, docs, commit messages and new code comments in this
                             # repo; empty = the language you write in. Skill issues stay English.

network:
  # CIDRs Claude may scan with nmap. Nothing outside these is ever scanned (enforced by a hook).
  authorized_ranges: []      # e.g. [10.0.10.0/24]
  # IPs/CIDRs never scanned, even inside an authorized range ({ip: …, site: <name>}: only at that site).
  excluded_hosts: []
  # VLANs by name, so "create a VM in DMZ" works: --vlan accepts a name, reports show the VLAN of an address.
  vlans: []                  # e.g. [{id: 20, name: DMZ, cidr: 10.0.20.0/24, gw: 10.0.20.1}]; site: <name>
                             # for a VLAN of one site only (sites: below), site: all for one every site has
  # Networks devices are managed from (IPv4 CIDRs): routeros-restrict-management.yml limits RouterOS ssh/winbox to
  # them. Include the network this Mac connects from, or the change locks Ansible out (the playbook refuses).
  management_ranges: []      # e.g. [10.0.99.0/24]
  dns_servers: []
  gateway: ""

proxmox:
  endpoint: ""               # e.g. https://pve1.home.arpa:8006; a cluster: several, first that answers wins
  verify_tls: true           # false only for self-signed certs; better: set ca_cert
  ca_cert: ""                # path to the Proxmox CA (pve-root-ca.pem)
  default_node: ""
  default_storage: ""        # VM disks, e.g. local-zfs
  lxc_storage: ""            # optional, LXC root filesystems (needs `rootdir` content); empty: default_storage
  image_storage: ""          # where cloud images are downloaded, e.g. local
  snippets_storage: ""       # optional, for cloud-init snippets
  nodes: {}                  # optional, a node whose storage differs (no shared storage, other disks), e.g.
                             # {pve3: {default_storage: local-lvm}}: replaces default_storage and lxc_storage on
                             # that node (lxc_storage falls back to its default_storage); also image_storage if set
  default_bridge: ""         # e.g. vmbr0
  tokens:
    read_only: proxmox-ro    # secret name below; role PVEAuditor on /
    provisioning: proxmox-rw # secret name below; custom role, see docs/proxmox-tokens.md

pbs: []                      # optional, Proxmox Backup Servers whose datastores OVERVIEW.md checks (GC, prune, verify):
                             # [{server: 10.0.10.20, token: pbs-ro}]; server as the Proxmox `pbs` storages name it (a
                             # list if they use several names), token: a secret below (DatastoreAudit role,
                             # docs/proxmox-tokens.md). TLS: pinned to the storage's fingerprint; or set ca_cert

sites: []                    # optional, for more than one location (references/proxmox.md "Several sites"):
                             # [{name, label, ranges, proxmox}], the default site first; its Proxmox is the
                             # proxmox: block above or sites[0].proxmox (one of the two). Inventory hosts belong
                             # to a site via the group site_<name>.
                             # Another site may set its own vmid_ranges, vmid_scheme, templates; its OpenTofu
                             # environment is tofu/environments/<name> (init_repo.py --add-site <name>).

vmid_ranges:                 # keep IDs predictable; the skill picks the next free ID in range
  base_images: [9000, 9049]
  templates: [9050, 9999]
  vms: [100, 899]
  lxc: [900, 999]
vmid_scheme: ""               # optional: derive VM/LXC IDs from the network instead of the ranges, for sites
                             # whose IDs encode it, e.g. "{vlan}{octet:03d}" → 1020015 (VLAN 1020, x.x.x.15).
                             # Placeholders: vlan, octet (last IP octet), o1-o4. Templates keep their ranges.

defaults:
  admin_user: ""             # user created by cloud-init on new VMs
  ssh_public_keys: []        # public keys injected via cloud-init (ssh-add -L shows agent keys)
  vm: {cores: 2, memory_mib: 2048, disk_gib: 20}
  lxc: {cores: 1, memory_mib: 512, disk_gib: 8}

templates:
  naming: "tpl-{distro}{version}-{date}"   # e.g. tpl-rocky9-20261116
  keep_versions: 3                          # older unused versions may be removed (with approval)
  build_network:                            # static IP for Packer builds (cloud images have no guest agent yet)
    ip: ""                                  # e.g. 10.0.10.250/24
    gateway: ""
    bridge: ""
  sshd_hardening: true                      # new templates allow SSH keys only (no password logins)
  unattended_updates: distro                # distro (as the image ships) | security | off (patch playbooks only)

opentofu:
  environment: homelab
  state_backend: local       # local | s3 — state is never stored in Git
  local:
    path: ""                 # empty = ~/.local/share/homelab/tofu-state/<site.name>/<environment>.tfstate;
                             # set with several sites: include {env}, e.g. ~/tofu-state/{env}.tfstate
  s3:                        # any S3-compatible store: MinIO, Garage, AWS (locking via lockfile)
    endpoint: ""             # e.g. https://minio.home.arpa:9000
    bucket: ""
    key: ""                  # empty = <site.name>/<environment>.tfstate; set with several sites: include {env}
    region: us-east-1        # most self-hosted stores ignore it
    use_path_style: true
  state_secret: s3-state     # keychain secret with the S3 keys (only for state_backend: s3)

overview:                    # OVERVIEW.md (overview.py), regenerated after every change
  redact: false              # true for a shared or public repo: mask IPs, MACs, domain and Proxmox hosts
  backup_max_age_days: 7     # a guest in a backup job without a successful backup this recent is a warning
  scrub_max_age_days: 35     # a ZFS pool whose last scrub is older is a warning
  disk_wearout_max_pct: 80   # an SSD worn this much (SMART wearout used) is a warning
  pbs_max_age_days: 7        # a PBS datastore whose last GC or prune, or oldest unverified snapshot, is older

ansible:
  default_linux_group: linux
  patch_serial: 5            # patch-linux.yml batch size for independent hosts (n or "25%");
                             # clusters and patch_requires_approval hosts always go one at a time

# Groups that must be changed one host at a time (patching, reboots, upgrades).
clusters: []
#  - name: k8s
#    ansible_group: k8s_workers
#    pre_hook: playbooks/hooks/k8s-drain.yml
#    post_hook: playbooks/hooks/k8s-uncordon.yml
#    health_check: playbooks/hooks/k8s-health.yml    # nodes Ready, no pods Pending; k8s_pending_ignore
#  - name: proxy                      # keepalived/VRRP pair: holder of the VIP last, always rebooted, health-gated
#    ansible_group: proxies
#    vip: 10.0.10.10
#    order: vip_holder_last
#    reboot: always                   # never | if_required | always
#    health_check: playbooks/hooks/vrrp-health.yml   # its settings: vip_port, health_services, health_containers

zabbix:                      # monitoring component (references/monitoring.md); empty url = not set up
  url: ""                    # API, e.g. https://zabbix.home.arpa/api_jsonrpc.php (zabbix_api.py probe <URL> finds it)
  verify_tls: true
  ca_cert: ""
  secrets: {ro: zabbix-ro, rw: zabbix-rw, admin: zabbix-admin}   # names under secrets: below
  host_match: []             # ordered rules inventory host → Zabbix host; the first `pattern` also names new hosts:
                             # [{pattern: "{host}.home.arpa"}, {pattern: "{short}.lab.example", sites: [lab]},
                             #  {regex: "^(?P<host>[a-z0-9-]+)[.]old[.]example$"}, {interface_ip: true}]
                             # {host} = inventory name, {short} = up to the first dot; host var zabbix_host_name wins
  managed_scope:             # the only objects ever written; the rest of the server stays read-only
    host_groups: []          # your own group trees, e.g. ["Home/*"] (Home and everything under it)
    shared_host_groups: []   # groups others use too (stock "Linux servers"): a host there is managed only when
                             # it matches an inventory host; the group itself is never changed
    template_groups: []      # where wrapper and imported templates live, e.g. ["Templates/Home/*"]
  ignore_groups: []          # inventory groups that aren't monitored (host var zabbix_monitor: false for one host)
  agent:                     # ansible/roles/zabbix_agent2 (playbooks/zabbix-agent2.yml)
    server: ""               # Server=: who may poll the agents (passive checks), e.g. zabbix.home.arpa
    server_active: ""        # ServerActive=: where they send active checks (host[:port], a proxy); empty = server
    mode: both               # both | passive (no active checks) | active (no passive checks: the agent doesn't listen)
    host_metadata: ""        # for hosts without HostMetadata, matching your autoregistration actions (zabbix_api.py
                             # discover lists their conditions), e.g. ":{os}:{distro}{major}:{virt}:"; empty = none
    version: ""              # empty = the server's major version (zabbix_api.py check shows it)
    psk_secret: ""           # optional, a secret below (kind env) with the PSK; identity: psk_identity
    psk_identity: ""
  patch_gate_severity: high  # patching stops on open problems at this severity or above (patch playbooks with -e zabbix=true)
  maintenance_hours: 2       # maintenance windows the skill opens end by themselves after this
  decommission_days: 30      # a decommissioned host is offered for deletion after this many days

# Keychain items (login keychain, account = $USER). Values are never stored in Git.
# Create one:  security add-generic-password -U -T /usr/bin/security -a "$USER" -s <service> -w
# (with nothing after -w, it prompts for the value so it never lands in shell history)
secrets:
  proxmox-ro:   {service: homelab/proxmox-ro,   kind: proxmox_token}   # user@pve!token=uuid
  proxmox-rw:   {service: homelab/proxmox-rw,   kind: proxmox_token}
  s3-state:     {service: homelab/s3-state,     kind: s3_credentials}  # ACCESS_KEY_ID:SECRET_ACCESS_KEY (S3 state only)
  # zabbix-ro:  {service: homelab/zabbix-ro,    kind: env, env: ZABBIX_RO_TOKEN}     # docs/zabbix-api-users.md
  # zabbix-rw:  {service: homelab/zabbix-rw,    kind: env, env: ZABBIX_RW_TOKEN}
  # zabbix-admin: {service: homelab/zabbix-admin, kind: env, env: ZABBIX_ADMIN_TOKEN} # optional, Super admin
  # pbs-ro:     {service: homelab/pbs-ro,       kind: pbs_token}       # user@pbs!token:secret (pbs: above)
  # bmc:        {service: homelab/bmc,          kind: user_password, env: BMC}   # user:password → BMC_USER/BMC_PASSWORD
  # unifi-api:  {service: homelab/unifi-api,    kind: env, env: UNIFI_API_KEY}   # UniFi Network Integration API key
  # unifi:      {service: homelab/unifi,        kind: user_password, env: UNIFI} # UniFi read-only admin (unifi_auth: login)

discovery:
  ignore_unmanaged: []       # IPs you know about and don't want flagged (phones, TVs, …); {ip, name, mac, site}

issues:
  file: skill_issues.md            # problems with / ideas for the homelab-manager skill itself (not the homelab)
  report: true               # offer to report them to the plugin's GitHub repository (sanitised, asks first)

permissions:
  auto_allow_readonly: false # true: the skill's read-only scripts run without a prompt (references/security.md)

upgrades:
  reviewed: ""               # upgrade notes reviewed up to this plugin version (init_repo.py --sync-managed)

git:
  branch: main
  auto_commit: true          # commit config changes after successful, verified operations
  auto_push: false           # also push each verified commit to the remote (never force) — backs the repo up off this Mac
