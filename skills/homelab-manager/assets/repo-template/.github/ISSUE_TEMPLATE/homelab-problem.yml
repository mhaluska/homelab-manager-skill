# Managed by the homelab-manager plugin — `init_repo.py --sync-managed` overwrites local edits.
# Same sections as ISSUES.md entries (issues.py), so Claude can import it (`issues.py pull <n>`) and fix it.
name: Homelab problem
description: Something broken, drifting or risky in the homelab.
title: "[area] "
labels: ["homelab"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in what you know; Claude fills the rest when it picks this up ("fix GitHub issue #N").
        **This repository may be public: no secrets, passwords, tokens or internal details you wouldn't publish.**
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences — what is wrong.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected
      description: Hosts, VMIDs, groups, files or components.
      placeholder: "dns01 (VMID 100); ansible/inventory/managed/hosts.yml"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [high, medium, low]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [proxmox, opentofu, templates, ansible, patching, network, security, drift, backups, windows, appliances, kubernetes, other]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The command you ran, when, and its output (trimmed).
      render: shell
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What breaks or is at risk if this stays, and how soon.
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix
      description: What you'd change, if you know.
  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: How to check it's fixed (a command and the expected output).
