# Managed inventory — hosts the homelab-manager is allowed to configure.
# Proxmox guests created by OpenTofu are added automatically in tofu_hosts.yml
# (generated by tofu_to_inventory.py). Put everything else here.
# Discovered-but-unmanaged devices live in discovery/network.json, not here.
all:
  children:
    linux:
      children:
        rocky: {}
        debian: {}
        ubuntu: {}
    windows:
      hosts: {}
    appliances:          # NAS, firewall, switches, BMCs: inventory + read-only checks by default
      hosts: {}
    proxmox_nodes:       # hypervisors: patched one at a time, with guests migrated first
      hosts: {}
