# Read-only: which systems have pending (security) updates or need a reboot.
# Writes discovery/updates.json.  Safe to run any time.
- name: Pending updates on Linux
  hosts: "{{ target | default('linux') }}"
  gather_facts: true
  become: true
  tasks:
    - name: RHEL family — security updates
      ansible.builtin.command: dnf -q updateinfo list --security --available
      register: rh_sec
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: RHEL family — all updates
      ansible.builtin.command: dnf -q check-update
      register: rh_all
      changed_when: false
      failed_when: rh_all.rc not in [0, 100]
      when: ansible_os_family == "RedHat"

    - name: RHEL family — reboot required
      ansible.builtin.command: needs-restarting -r
      register: rh_reboot
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Debian family — refresh package lists
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Debian family — simulate upgrade
      ansible.builtin.command: apt-get -s -o Debug::NoLocking=1 dist-upgrade
      register: deb_sim
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Debian family — reboot required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: deb_reboot
      when: ansible_os_family == "Debian"

    - name: Summarise
      ansible.builtin.set_fact:
        update_summary:
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          pending: >-
            {{ (rh_all.stdout_lines | default([]) | select('match', '^\S+\.\S+\s') | list | length)
               if ansible_os_family == 'RedHat'
               else (deb_sim.stdout_lines | default([]) | select('match', '^Inst ') | list | length) }}
          security: >-
            {{ (rh_sec.stdout_lines | default([]) | length)
               if ansible_os_family == 'RedHat'
               else (deb_sim.stdout_lines | default([]) | select('match', '^Inst .*[Ss]ecurity') | list | length) }}
          reboot_required: >-
            {{ (rh_reboot.rc | default(0)) == 1 if ansible_os_family == 'RedHat'
               else (deb_reboot.stat.exists | default(false)) }}

- name: Pending updates on Windows (search only, installs nothing)
  hosts: "{{ windows_target | default('windows') }}"
  gather_facts: false
  tasks:
    - name: Search
      ansible.windows.win_updates:
        state: searched
        category_names: [SecurityUpdates, CriticalUpdates, UpdateRollups]
      register: win_upd
    - ansible.builtin.set_fact:
        update_summary:
          os: windows
          pending: "{{ win_upd.found_update_count | default(0) }}"
          security: "{{ win_upd.updates | default({}) | dict2items | selectattr('value.categories', 'contains', 'Security Updates') | list | length }}"
          reboot_required: "{{ win_upd.reboot_required | default(false) }}"

- name: Write discovery/updates.json
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../discovery/updates.json"
        content: "{{ {'collected_at': now(utc=true).isoformat(), 'hosts': dict(reported | zip(reported | map('extract', hostvars, 'update_summary')))} | to_nice_json }}"
        mode: "0644"
      vars:
        reported: "{{ groups['all'] | map('extract', hostvars) | selectattr('update_summary', 'defined') | map(attribute='inventory_hostname') | list }}"
